<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrewOS — Operating System for Temporary Teams</title>
  
  <!-- Modern Clean Typography: Inter & Geist-inspired System Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel for standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons & Supabase Client SDK -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            app: {
              base: '#0B0F17',
              panel: '#111622',
              card: '#161C2C',
              border: '#1E2638',
              accent: '#3B82F6',
              accentHover: '#2563EB',
              textMuted: '#8492A6'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Clean custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0B0F17; }
    ::-webkit-scrollbar-thumb { background: #1E2638; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2E384D; }

    @media print {
      body { background: #ffffff !important; color: #111827 !important; }
      .no-print { display: none !important; }
      .print-card { border: 1px solid #e5e7eb !important; background: #ffffff !important; color: #111827 !important; }
    }
  </style>
</head>

<body class="bg-app-base text-slate-100 font-sans antialiased selection:bg-blue-600/30 selection:text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SUPABASE CLIENT CONFIGURATION ---
    const SUPABASE_URL = 'https://rcnnuvhwzfbntkkizaai.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjbm51dmh3emZibnRra2l6YWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzk1NDYsImV4cCI6MjEwODk1NTU0Nn0.4yTn-ZKE0cTd10MnjVtZnhtGqis2a7B65XQ0WCbbJdo';
    
    const supabase = (window.supabase && SUPABASE_URL.indexOf('YOUR_PROJECT_ID') === -1)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const STORAGE_KEY = 'crewos_db_v3';

    function loadCachedDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { currency: 'INR', currencySymbol: '₹', projects: [] };
    }

    function saveCachedDB(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function CrewOSApp() {
      const [db, setDb] = useState(loadCachedDB);
      const [view, setView] = useState('landing'); // 'landing' | 'dashboard' | 'project' | 'new-project'
      const [activeProjectId, setActiveProjectId] = useState(null);
      const [activeProjectTab, setActiveProjectTab] = useState('overview');
      const [isAIModalOpen, setIsAIModalOpen] = useState(false);
      const [aiMode, setAiMode] = useState('plan');
      const [inviteModalOpen, setInviteModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // --- AUTHENTICATION STATE ---
      const [authUser, setAuthUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('signin'); // 'signin' or 'signup'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authErrorMessage, setAuthErrorMessage] = useState('');

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      const updateDb = (newDb) => {
        setDb(newDb);
        saveCachedDB(newDb);
      };

      // Lucide icon refresh
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // --- SUPABASE SESSION LISTENER ---
      useEffect(() => {
        if (!supabase) return;

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            setAuthUser(session.user);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session?.user) {
            setAuthUser(session.user);
            setAuthModalOpen(false);
            if (view === 'landing') setView('dashboard');
          } else {
            setAuthUser(null);
            setView('landing');
          }
        });

        return () => subscription.unsubscribe();
      }, [view]);

      // --- LOAD REMOTE DATA (ONLY FOR LOGGED-IN USERS) ---
      useEffect(() => {
        if (!supabase || !authUser) return;

        async function fetchUserData() {
          try {
            const { data: remoteProjects, error } = await supabase
              .from('projects')
              .select('*, tasks (*), decisions (*), expenses (*)');

            if (error) {
              console.warn('Supabase fetch notice:', error.message);
              return;
            }

            if (remoteProjects) {
              const formatted = remoteProjects.map(p => ({
                id: p.id,
                name: p.name,
                tagline: p.tagline,
                category: p.category,
                status: p.status || 'Active',
                startDate: p.start_date,
                targetDate: p.target_date,
                totalBudget: Number(p.total_budget || 0),
                progress: p.progress || 0,
                members: [
                  { 
                    id: authUser.id, 
                    name: authUser.user_metadata?.full_name || authUser.email.split('@')[0], 
                    role: 'Owner', 
                    title: 'Lead', 
                    email: authUser.email 
                  }
                ],
                tasks: (p.tasks || []).map(t => ({
                  id: t.id,
                  title: t.title,
                  column: t.column_name,
                  priority: t.priority,
                  assignee: t.assignee,
                  dueDate: t.due_date
                })),
                decisions: (p.decisions || []).map(d => ({
                  ...d,
                  approvedBy: d.approved_by
                })),
                expenses: p.expenses || [],
                resources: [],
                activity: []
              }));

              setDb(prev => ({ ...prev, projects: formatted }));
              if (formatted.length > 0 && !activeProjectId) {
                setActiveProjectId(formatted[0].id);
              }
            }
          } catch (err) {
            console.error('Data retrieval failed:', err);
          }
        }

        fetchUserData();
      }, [authUser]);

      // --- AUTH METHODS ---
      const handleEmailAuth = async (e) => {
        e.preventDefault();
        if (!supabase) {
          setAuthErrorMessage('Supabase client is not ready.');
          return;
        }
        setAuthLoading(true);
        setAuthErrorMessage('');

        try {
          if (authMode === 'signup') {
            const { data, error } = await supabase.auth.signUp({
              email: authEmail,
              password: authPassword,
              options: {
                data: {
                  full_name: authEmail.split('@')[0]
                }
              }
            });
            if (error) throw error;
            if (data?.session) {
              showToast('Account created and logged in.');
              setAuthModalOpen(false);
              setView('dashboard');
            } else {
              showToast('Check your email for confirmation, or disable "Confirm email" in Supabase settings.');
            }
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: authEmail,
              password: authPassword
            });
            if (error) throw error;
            showToast('Signed in successfully.');
            setAuthModalOpen(false);
            setView('dashboard');
          }
        } catch (err) {
          setAuthErrorMessage(err.message || 'Authentication failed. Please verify credentials.');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleGoogleAuth = async () => {
        if (!supabase) return;
        setAuthLoading(true);
        setAuthErrorMessage('');

        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin
            }
          });
          if (error) throw error;
        } catch (err) {
          setAuthErrorMessage(err.message || 'Google sign-in error.');
          setAuthLoading(false);
        }
      };

      const handleSignOut = async () => {
        if (!supabase) return;
        await supabase.auth.signOut();
        setAuthUser(null);
        setView('landing');
        showToast('Signed out.');
      };

      // Current active project
      const project = useMemo(() => {
        return db.projects.find(p => p.id === activeProjectId) || db.projects[0] || null;
      }, [db.projects, activeProjectId]);

      const budgetMetrics = useMemo(() => {
        if (!project) return { spent: 0, planned: 0, remaining: 0, percent: 0 };
        const spent = project.expenses.filter(e => e.status === 'Paid').reduce((acc, c) => acc + c.amount, 0);
        const planned = project.expenses.filter(e => e.status === 'Planned').reduce((acc, c) => acc + c.amount, 0);
        const remaining = Math.max(0, project.totalBudget - spent);
        const percent = project.totalBudget > 0 ? Math.round((spent / project.totalBudget) * 100) : 0;
        return { spent, planned, remaining, percent };
      }, [project]);

      const taskMetrics = useMemo(() => {
        if (!project || !project.tasks.length) return { total: 0, done: 0, progress: 0, urgent: 0 };
        const total = project.tasks.length;
        const done = project.tasks.filter(t => t.column === 'done').length;
        const urgent = project.tasks.filter(t => t.priority === 'urgent' && t.column !== 'done').length;
        return { total, done, progress: Math.round((done / total) * 100), urgent };
      }, [project]);

      const formatCurrency = (amt) => `${db.currencySymbol || '₹'}${Number(amt).toLocaleString()}`;

      // Enforce auth gate for internal views
      const requireAuth = (targetView) => {
        if (!authUser) {
          setAuthMode('signin');
          setAuthModalOpen(true);
        } else {
          setView(targetView);
        }
      };

      return (
        <div className="min-h-screen bg-app-base text-slate-100 flex flex-col font-sans">
          
          {/* Notifications */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-2.5 rounded-lg bg-app-card border border-app-border text-sm text-slate-200 shadow-xl">
              <span className="w-2 h-2 rounded-full bg-blue-500"></span>
              <span>{toast}</span>
            </div>
          )}

          {/* Clean, Professional Top Navigation Bar */}
          <header className="sticky top-0 z-40 w-full border-b border-app-border bg-app-base/90 backdrop-blur-md">
            <div className="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div 
                onClick={() => setView(authUser ? 'dashboard' : 'landing')} 
                className="flex items-center gap-2.5 cursor-pointer font-semibold text-slate-100 tracking-tight text-sm"
              >
                <div className="w-6 h-6 rounded bg-blue-600 flex items-center justify-center text-white text-xs font-bold">
                  C
                </div>
                <span>CrewOS</span>
              </div>

              {/* Navigation Links: Visible only when logged in */}
              {authUser ? (
                <nav className="flex items-center gap-6 text-xs font-medium text-slate-400">
                  <button 
                    onClick={() => setView('dashboard')} 
                    className={`transition-colors hover:text-slate-100 ${view === 'dashboard' ? 'text-slate-100 font-semibold' : ''}`}
                  >
                    Dashboard
                  </button>
                  <button 
                    onClick={() => {
                      if (!project && db.projects.length === 0) {
                        setView('new-project');
                      } else {
                        setView('project');
                      }
                    }} 
                    className={`transition-colors hover:text-slate-100 ${view === 'project' ? 'text-slate-100 font-semibold' : ''}`}
                  >
                    Workspace
                  </button>
                  <button 
                    onClick={() => setIsAIModalOpen(true)} 
                    className="text-blue-400 hover:text-blue-300 transition-colors"
                  >
                    AI Planner
                  </button>
                </nav>
              ) : (
                <div className="hidden sm:block text-xs text-slate-500 font-mono">
                  Temporary Team Infrastructure
                </div>
              )}

              {/* Action Buttons */}
              <div className="flex items-center gap-3">
                {authUser ? (
                  <div className="flex items-center gap-3">
                    <button 
                      onClick={() => setView('new-project')}
                      className="px-3 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white transition-colors"
                    >
                      New Mission
                    </button>
                    <span className="text-xs text-slate-400 font-mono hidden md:inline">
                      {authUser.email}
                    </span>
                    <button 
                      onClick={handleSignOut}
                      className="text-xs text-slate-400 hover:text-slate-200 border-l border-app-border pl-3 py-1"
                    >
                      Sign Out
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => { setAuthMode('signin'); setAuthModalOpen(true); }}
                      className="px-3 py-1.5 rounded-md text-xs font-medium text-slate-300 hover:text-white transition-colors"
                    >
                      Sign In
                    </button>
                    <button 
                      onClick={() => { setAuthMode('signup'); setAuthModalOpen(true); }}
                      className="px-3.5 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white transition-colors"
                    >
                      Get Started
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* ========================================================
              VIEW 1: CLEAN PROFESSIONAL MARKETING LANDING PAGE
              (All repetitive feature cards removed)
             ======================================================== */}
          {view === 'landing' && (
            <main className="flex-1 flex flex-col justify-center max-w-4xl mx-auto px-6 py-20 text-center">
              
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-app-border bg-app-panel text-xs text-slate-400 mx-auto mb-8 font-mono">
                <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                The Operating System for Teams on a Mission
              </div>

              <h1 className="text-4xl sm:text-6xl font-bold tracking-tight text-white max-w-2xl mx-auto leading-tight mb-6">
                Organize, execute, and deliver your next mission.
              </h1>

              <p className="text-slate-400 text-base sm:text-lg max-w-xl mx-auto leading-relaxed mb-10">
                A shared workspace for temporary squads, hackathons, and sprint crews. Manage tasks, record critical decisions, and audit expenses without fragmented chat threads.
              </p>

              <div className="flex flex-col sm:flex-row items-center justify-center gap-3 mb-16">
                <button 
                  onClick={() => requireAuth('dashboard')}
                  className="w-full sm:w-auto px-6 py-2.5 rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 transition-colors shadow-sm"
                >
                  Start a crew workspace →
                </button>
                <button 
                  onClick={() => { setAuthMode('signin'); setAuthModalOpen(true); }}
                  className="w-full sm:w-auto px-6 py-2.5 rounded-md text-sm font-medium text-slate-300 bg-app-panel border border-app-border hover:bg-app-card transition-colors"
                >
                  Sign In to existing mission
                </button>
              </div>

              {/* Minimal Three-Pillar Overview */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-left border-t border-app-border pt-12">
                <div className="p-5 rounded-lg border border-app-border bg-app-panel/50">
                  <div className="text-xs font-mono text-blue-400 mb-1">01 / COORDINATION</div>
                  <h3 className="text-sm font-semibold text-white mb-1.5">Actionable Task Kanban</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Direct sprint boards with deadline assignment and ownership tracking for rapid execution.</p>
                </div>
                <div className="p-5 rounded-lg border border-app-border bg-app-panel/50">
                  <div className="text-xs font-mono text-blue-400 mb-1">02 / GOVERNANCE</div>
                  <h3 className="text-sm font-semibold text-white mb-1.5">Signed Decision Ledger</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Lock agreed technical, architectural, and resource decisions so context is never lost in chat.</p>
                </div>
                <div className="p-5 rounded-lg border border-app-border bg-app-panel/50">
                  <div className="text-xs font-mono text-blue-400 mb-1">03 / HANDOVER</div>
                  <h3 className="text-sm font-semibold text-white mb-1.5">Reconciliation & Export</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Track expenses in real time and generate a clean final project handover dossier on completion.</p>
                </div>
              </div>
            </main>
          )}

          {/* ========================================================
              VIEW 2: MAIN DASHBOARD (AUTHENTICATED ONLY)
             ======================================================== */}
          {view === 'dashboard' && authUser && (
            <main className="max-w-6xl mx-auto px-6 py-8 flex-1 w-full">
              <div className="flex items-center justify-between pb-6 border-b border-app-border mb-8">
                <div>
                  <h1 className="text-xl font-bold text-white tracking-tight">Active Missions</h1>
                  <p className="text-xs text-slate-400 mt-1">Select a workspace or launch a new initiative.</p>
                </div>
                <button 
                  onClick={() => setView('new-project')}
                  className="px-3.5 py-2 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white transition-colors"
                >
                  + New Mission
                </button>
              </div>

              {db.projects.length === 0 ? (
                <div className="p-12 text-center border border-dashed border-app-border rounded-lg bg-app-panel/30">
                  <h3 className="text-sm font-semibold text-white mb-1">No active missions</h3>
                  <p className="text-xs text-slate-400 mb-4">You have not created or joined any project workspaces yet.</p>
                  <button 
                    onClick={() => setView('new-project')}
                    className="px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white"
                  >
                    Launch Your First Workspace
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {db.projects.map(proj => (
                    <div 
                      key={proj.id}
                      onClick={() => { setActiveProjectId(proj.id); setView('project'); }}
                      className="p-5 rounded-lg border border-app-border bg-app-panel hover:border-slate-600 transition-colors cursor-pointer"
                    >
                      <div className="flex items-start justify-between">
                        <div>
                          <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-app-card border border-app-border text-slate-300">
                            {proj.category}
                          </span>
                          <h3 className="text-base font-semibold text-white mt-2">{proj.name}</h3>
                          <p className="text-xs text-slate-400 mt-1 line-clamp-1">{proj.tagline}</p>
                        </div>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">
                          {proj.status}
                        </span>
                      </div>
                      <div className="mt-6 pt-4 border-t border-app-border flex items-center justify-between text-xs text-slate-400 font-mono">
                        <span>Due: {proj.targetDate}</span>
                        <span>{proj.tasks.length} tasks recorded</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* ========================================================
              VIEW 3: CREATE PROJECT WIZARD
             ======================================================== */}
          {view === 'new-project' && authUser && (
            <main className="max-w-xl mx-auto px-6 py-12 flex-1 w-full">
              <div className="mb-6">
                <button 
                  onClick={() => setView('dashboard')}
                  className="text-xs text-slate-400 hover:text-white mb-2 block"
                >
                  ← Back to dashboard
                </button>
                <h1 className="text-xl font-bold text-white tracking-tight">Create Workspace</h1>
                <p className="text-xs text-slate-400 mt-1">Configure parameters for your temporary team squad.</p>
              </div>

              <form onSubmit={async (e) => {
                e.preventDefault();
                const form = e.target;
                const newProj = {
                  id: `proj-${Date.now()}`,
                  name: form.projName.value,
                  tagline: form.projTagline.value,
                  category: form.projCategory.value,
                  status: 'Active',
                  startDate: new Date().toISOString().split('T')[0],
                  targetDate: form.projTargetDate.value,
                  totalBudget: Number(form.projBudget.value) || 100000,
                  progress: 0,
                  members: [{ id: authUser.id, name: authUser.email.split('@')[0], role: 'Owner', title: 'Lead', email: authUser.email }],
                  tasks: [],
                  decisions: [],
                  expenses: [],
                  resources: [],
                  activity: []
                };

                updateDb({ ...db, projects: [newProj, ...db.projects] });
                setActiveProjectId(newProj.id);
                setView('project');

                if (supabase) {
                  await supabase.from('projects').insert([{
                    id: newProj.id,
                    name: newProj.name,
                    tagline: newProj.tagline,
                    category: newProj.category,
                    status: newProj.status,
                    start_date: newProj.startDate,
                    target_date: newProj.targetDate,
                    total_budget: newProj.totalBudget,
                    progress: newProj.progress
                  }]);
                }
                showToast(`Workspace initialized: ${newProj.name}`);
              }} className="p-6 rounded-lg border border-app-border bg-app-panel space-y-4">
                <div>
                  <label className="text-xs font-medium text-slate-300 block mb-1">Project Name</label>
                  <input name="projName" required placeholder="Launch Project Atlas" className="w-full px-3 py-2 rounded-md bg-app-base border border-app-border text-xs text-white outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-300 block mb-1">Mission Objective</label>
                  <input name="projTagline" required placeholder="Autonomous delivery network pilot" className="w-full px-3 py-2 rounded-md bg-app-base border border-app-border text-xs text-white outline-none focus:border-blue-500" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Category</label>
                    <select name="projCategory" className="w-full px-3 py-2 rounded-md bg-app-base border border-app-border text-xs text-white outline-none">
                      <option value="Startup Launch">Startup Launch</option>
                      <option value="Hackathon">Hackathon</option>
                      <option value="Event Planning">Event</option>
                      <option value="Operations">Operations</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Target Date</label>
                    <input type="date" name="projTargetDate" defaultValue="2026-12-31" className="w-full px-3 py-2 rounded-md bg-app-base border border-app-border text-xs text-white outline-none" />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-300 block mb-1">Estimated Budget ({db.currency})</label>
                  <input type="number" name="projBudget" defaultValue="250000" className="w-full px-3 py-2 rounded-md bg-app-base border border-app-border text-xs text-white outline-none" />
                </div>
                <button type="submit" className="w-full py-2.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white transition-colors">
                  Create Workspace
                </button>
              </form>
            </main>
          )}

          {/* ========================================================
              VIEW 4: PROJECT WORKSPACE
             ======================================================== */}
          {view === 'project' && authUser && project && (
            <main className="max-w-6xl mx-auto px-6 py-6 flex-1 w-full">
              <div className="p-6 rounded-lg border border-app-border bg-app-panel mb-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-app-card border border-app-border text-slate-300">
                      {project.category}
                    </span>
                    <h1 className="text-xl font-bold text-white mt-2">{project.name}</h1>
                    <p className="text-xs text-slate-400 mt-0.5">{project.tagline}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setInviteModalOpen(true)} className="px-3 py-1.5 rounded-md border border-app-border text-xs text-slate-300 hover:text-white hover:bg-app-card">
                      + Invite Teammates
                    </button>
                    <button onClick={() => setIsAIModalOpen(true)} className="px-3 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs text-white font-medium">
                      AI Sprint Breakdown
                    </button>
                  </div>
                </div>

                <div className="flex gap-2 mt-6 pt-4 border-t border-app-border text-xs">
                  {['overview', 'tasks', 'decisions', 'budget'].map(tab => (
                    <button 
                      key={tab} 
                      onClick={() => setActiveProjectTab(tab)} 
                      className={`px-3 py-1.5 rounded-md capitalize transition-colors ${activeProjectTab === tab ? 'bg-app-card text-white border border-app-border' : 'text-slate-400 hover:text-slate-200'}`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>
              </div>

              {/* OVERVIEW TAB */}
              {activeProjectTab === 'overview' && (
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="p-5 rounded-lg border border-app-border bg-app-panel">
                    <span className="text-[10px] font-mono text-slate-400 uppercase">Velocity</span>
                    <div className="text-2xl font-bold text-white mt-1">{taskMetrics.progress}%</div>
                    <div className="w-full bg-app-card h-1.5 rounded-full mt-3 overflow-hidden">
                      <div className="bg-blue-500 h-full rounded-full" style={{ width: `${taskMetrics.progress}%` }}></div>
                    </div>
                  </div>
                  <div className="p-5 rounded-lg border border-app-border bg-app-panel">
                    <span className="text-[10px] font-mono text-slate-400 uppercase">Budget Expended</span>
                    <div className="text-2xl font-bold text-white mt-1">{formatCurrency(budgetMetrics.spent)}</div>
                    <div className="text-xs text-slate-400 mt-1">Allocated: {formatCurrency(project.totalBudget)}</div>
                  </div>
                  <div className="p-5 rounded-lg border border-app-border bg-app-panel">
                    <span className="text-[10px] font-mono text-slate-400 uppercase">Decisions Signed</span>
                    <div className="text-2xl font-bold text-white mt-1">{project.decisions.length}</div>
                    <div className="text-xs text-slate-400 mt-1">Audit log active</div>
                  </div>
                </div>
              )}

              {/* TASKS TAB */}
              {activeProjectTab === 'tasks' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-sm font-semibold text-white uppercase tracking-wider">Sprint Task Board</h2>
                    <button onClick={async () => {
                      const title = prompt('Task title:');
                      if (!title) return;
                      const newTask = {
                        id: `t-${Date.now()}`,
                        title,
                        column: 'todo',
                        priority: 'high',
                        assignee: authUser.email.split('@')[0],
                        dueDate: '2026-11-20'
                      };
                      const updatedProjects = db.projects.map(p => p.id === project.id ? { ...p, tasks: [newTask, ...p.tasks] } : p);
                      updateDb({ ...db, projects: updatedProjects });

                      if (supabase) {
                        await supabase.from('tasks').insert([{
                          id: newTask.id,
                          project_id: project.id,
                          title: newTask.title,
                          column_name: newTask.column,
                          priority: newTask.priority,
                          assignee: newTask.assignee,
                          due_date: newTask.dueDate
                        }]);
                      }
                      showToast(`Task created: ${title}`);
                    }} className="px-3 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white">
                      + Add Task
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                    {['todo', 'in_progress', 'review', 'done'].map(col => {
                      const colTasks = project.tasks.filter(t => t.column === col);
                      return (
                        <div key={col} className="p-3.5 rounded-lg border border-app-border bg-app-panel flex flex-col">
                          <div className="flex justify-between items-center pb-2.5 mb-2.5 border-b border-app-border text-xs font-semibold uppercase text-slate-400">
                            <span>{col.replace('_', ' ')}</span>
                            <span className="font-mono text-[10px] px-1.5 py-0.5 rounded bg-app-card text-slate-300">{colTasks.length}</span>
                          </div>
                          <div className="space-y-2 flex-1">
                            {colTasks.map(t => (
                              <div key={t.id} className="p-3 rounded-md border border-app-border bg-app-card text-xs">
                                <div className="font-medium text-slate-200">{t.title}</div>
                                <div className="text-[10px] text-slate-400 mt-2 flex justify-between items-center">
                                  <span>{t.assignee}</span>
                                  <select 
                                    value={t.column} 
                                    onChange={async (e) => {
                                      const newCol = e.target.value;
                                      const updatedTasks = project.tasks.map(x => x.id === t.id ? { ...x, column: newCol } : x);
                                      updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, tasks: updatedTasks } : p) });
                                      if (supabase) await supabase.from('tasks').update({ column_name: newCol }).eq('id', t.id);
                                    }} 
                                    className="bg-app-base text-slate-300 rounded px-1.5 py-0.5 border border-app-border outline-none text-[10px]"
                                  >
                                    <option value="todo">To Do</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="review">Review</option>
                                    <option value="done">Done</option>
                                  </select>
                                </div>
                              </div>
                            ))}
                            {colTasks.length === 0 && (
                              <div className="p-4 text-center text-[10px] text-slate-500 font-mono border border-dashed border-app-border rounded">
                                Empty
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* DECISIONS TAB */}
              {activeProjectTab === 'decisions' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-sm font-semibold text-white uppercase tracking-wider">Signed Decisions Log</h2>
                    <button onClick={async () => {
                      const title = prompt('Decision topic:');
                      if (!title) return;
                      const chosen = prompt('Chosen option:') || '';
                      const rationale = prompt('Rationale:') || '';
                      const newDec = {
                        id: `dec-${Date.now()}`,
                        title,
                        context: 'Recorded via alignment meeting.',
                        chosen,
                        rationale,
                        status: 'Approved',
                        owner: authUser.email.split('@')[0],
                        approvedBy: authUser.email.split('@')[0],
                        date: new Date().toISOString().split('T')[0]
                      };
                      updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, decisions: [newDec, ...p.decisions] } : p) });
                      if (supabase) {
                        await supabase.from('decisions').insert([{
                          id: newDec.id,
                          project_id: project.id,
                          title: newDec.title,
                          context: newDec.context,
                          chosen: newDec.chosen,
                          rationale: newDec.rationale,
                          status: newDec.status,
                          owner: newDec.owner,
                          approved_by: newDec.approvedBy,
                          date: newDec.date
                        }]);
                      }
                      showToast('Decision registered.');
                    }} className="px-3 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white">
                      + Record Decision
                    </button>
                  </div>

                  <div className="space-y-3">
                    {project.decisions.map(d => (
                      <div key={d.id} className="p-4 rounded-lg border border-app-border bg-app-panel text-xs">
                        <div className="flex justify-between font-semibold text-white text-sm mb-1.5">
                          <span>{d.title}</span>
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">{d.status}</span>
                        </div>
                        <p className="text-slate-300"><strong>Chosen:</strong> {d.chosen}</p>
                        <p className="text-slate-400 mt-0.5"><strong>Rationale:</strong> {d.rationale}</p>
                        <div className="mt-2 pt-2 border-t border-app-border text-[10px] font-mono text-slate-500">Signed on {d.date} by {d.approvedBy}</div>
                      </div>
                    ))}
                    {project.decisions.length === 0 && (
                      <div className="p-8 text-center text-xs text-slate-500 border border-dashed border-app-border rounded-lg">
                        No signed decisions recorded for this mission yet.
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* BUDGET TAB */}
              {activeProjectTab === 'budget' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-sm font-semibold text-white uppercase tracking-wider">Expense Ledger</h2>
                      <p className="text-xs text-slate-400 mt-0.5">Spent: {formatCurrency(budgetMetrics.spent)} of {formatCurrency(project.totalBudget)}</p>
                    </div>
                    <button onClick={async () => {
                      const title = prompt('Expense description:');
                      if (!title) return;
                      const amount = Number(prompt('Amount:')) || 0;
                      const newExp = {
                        id: `exp-${Date.now()}`,
                        title,
                        category: 'Operations',
                        amount,
                        date: new Date().toISOString().split('T')[0],
                        payer: authUser.email.split('@')[0],
                        status: 'Paid'
                      };
                      updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, expenses: [newExp, ...p.expenses] } : p) });
                      if (supabase) {
                        await supabase.from('expenses').insert([{
                          id: newExp.id,
                          project_id: project.id,
                          title: newExp.title,
                          category: newExp.category,
                          amount: newExp.amount,
                          payer: newExp.payer,
                          date: newExp.date,
                          status: newExp.status
                        }]);
                      }
                      showToast('Expense added.');
                    }} className="px-3 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white">
                      + Add Expense
                    </button>
                  </div>

                  <div className="rounded-lg border border-app-border bg-app-panel overflow-hidden text-xs">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b border-app-border text-slate-400 font-mono text-[10px]">
                          <th className="p-3">Description</th>
                          <th className="p-3">Payer</th>
                          <th className="p-3 text-right">Amount</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-app-border">
                        {project.expenses.map(e => (
                          <tr key={e.id}>
                            <td className="p-3 font-medium text-slate-200">{e.title}</td>
                            <td className="p-3 text-slate-400">{e.payer}</td>
                            <td className="p-3 text-right font-mono text-slate-100">{formatCurrency(e.amount)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          )}

          {/* ========================================================
              CLEAN MINIMAL AUTH MODAL (EMAIL + GOOGLE)
             ======================================================== */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
              <div className="w-full max-w-sm p-6 rounded-lg bg-app-panel border border-app-border shadow-2xl">
                
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-base font-semibold text-white">
                    {authMode === 'signin' ? 'Sign in to CrewOS' : 'Create an account'}
                  </h3>
                  <button onClick={() => setAuthModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {/* Google Sign-in Button */}
                <button
                  type="button"
                  onClick={handleGoogleAuth}
                  className="w-full flex items-center justify-center gap-2.5 py-2.5 px-4 rounded-md border border-app-border bg-app-card hover:bg-slate-800 text-xs font-medium text-slate-200 transition-colors mb-4"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                    <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.1 7.5 23 12 23z"/>
                  </svg>
                  <span>Continue with Google</span>
                </button>

                <div className="flex items-center gap-3 my-4">
                  <div className="flex-1 h-px bg-app-border"></div>
                  <span className="text-[10px] text-slate-500 uppercase font-mono">or email</span>
                  <div className="flex-1 h-px bg-app-border"></div>
                </div>

                {authErrorMessage && (
                  <div className="p-2.5 mb-3 rounded bg-red-500/10 border border-red-500/20 text-xs text-red-400">
                    {authErrorMessage}
                  </div>
                )}

                <form onSubmit={handleEmailAuth} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Email address</label>
                    <input 
                      type="email" 
                      required 
                      placeholder="name@organization.com" 
                      value={authEmail} 
                      onChange={e => setAuthEmail(e.target.value)} 
                      className="w-full px-3 py-2 rounded-md bg-app-base border border-app-border text-xs text-white outline-none focus:border-blue-500" 
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Password</label>
                    <input 
                      type="password" 
                      required 
                      minLength="6" 
                      placeholder="••••••••" 
                      value={authPassword} 
                      onChange={e => setAuthPassword(e.target.value)} 
                      className="w-full px-3 py-2 rounded-md bg-app-base border border-app-border text-xs text-white outline-none focus:border-blue-500" 
                    />
                  </div>

                  <button 
                    type="submit" 
                    disabled={authLoading} 
                    className="w-full py-2.5 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white transition-colors disabled:opacity-50 mt-1"
                  >
                    {authLoading ? 'Verifying...' : (authMode === 'signin' ? 'Sign In' : 'Create Account')}
                  </button>
                </form>

                <div className="mt-4 text-center text-xs text-slate-400">
                  <button 
                    onClick={() => { setAuthErrorMessage(''); setAuthMode(m => m === 'signin' ? 'signup' : 'signin'); }} 
                    className="text-blue-400 hover:underline"
                  >
                    {authMode === 'signin' ? 'Need an account? Sign up' : 'Already have an account? Sign in'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AI MODAL */}
          {isAIModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-lg p-6 rounded-lg bg-app-panel border border-app-border">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-sm font-semibold text-white">AI Sprint Decomposition</h3>
                  <button onClick={() => setIsAIModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <p className="text-xs text-slate-400 mb-3">Provide a rough scope goal to auto-generate sprint task phases.</p>
                <textarea rows="3" defaultValue="Deploy beta client onboarding portal and safety compliance checks in 3 weeks." className="w-full p-3 rounded-md bg-app-base border border-app-border text-xs text-white mb-3 outline-none focus:border-blue-500"></textarea>
                <button onClick={async () => {
                  if (!project) return;
                  const aiTask = {
                    id: `t-ai-${Date.now()}`,
                    title: 'Conduct automated safety compliance check audit',
                    column: 'todo',
                    priority: 'urgent',
                    assignee: authUser ? authUser.email.split('@')[0] : 'Lead',
                    dueDate: '2026-11-25'
                  };
                  updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, tasks: [aiTask, ...p.tasks] } : p) });
                  if (supabase) {
                    await supabase.from('tasks').insert([{
                      id: aiTask.id,
                      project_id: project.id,
                      title: aiTask.title,
                      column_name: aiTask.column,
                      priority: aiTask.priority,
                      assignee: aiTask.assignee,
                      due_date: aiTask.dueDate
                    }]);
                  }
                  setIsAIModalOpen(false);
                  showToast('AI synthesized sprint tasks.');
                }} className="w-full py-2 rounded-md bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white">
                  Synthesize Tasks →
                </button>
              </div>
            </div>
          )}

          {/* INVITE MODAL */}
          {inviteModalOpen && project && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-md p-6 rounded-lg bg-app-panel border border-app-border">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-sm font-semibold text-white">Share Workspace Link</h3>
                  <button onClick={() => setInviteModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <div className="p-3 rounded bg-app-base border border-app-border flex items-center justify-between text-xs font-mono text-slate-300">
                  <span className="truncate">{window.location.origin}/join/{project.id}</span>
                  <button onClick={() => {
                    navigator.clipboard.writeText(`${window.location.origin}/join/${project.id}`);
                    showToast('Copied to clipboard');
                    setInviteModalOpen(false);
                  }} className="ml-3 px-2.5 py-1 rounded bg-blue-600 text-white font-sans text-xs">
                    Copy
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CrewOSApp />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrewOS — The Operating System for Teams on a Mission</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            midnight: '#040714',
            surface: {
              DEFAULT: '#080E21',
              elevated: '#0D1630',
              glass: 'rgba(255, 255, 255, 0.04)',
              glassBorder: 'rgba(255, 255, 255, 0.12)',
            },
            aura: {
              blue: '#2563EB',
              cyan: '#06B6D4',
              sky: '#38BDF8',
              coral: '#FF6B4A',
              sunset: '#F97316',
              peach: '#FDA4AF',
              amber: '#F59E0B'
            }
          },
          boxShadow: {
            'glow-cyan': '0 0 35px -5px rgba(6, 182, 212, 0.35)',
            'glow-coral': '0 0 45px -8px rgba(255, 107, 74, 0.4)',
            'glass': '0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12)'
          }
        }
      }
    }
  </script>

  <style>
    .fluted-overlay {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.015) 0px,
        rgba(255, 255, 255, 0.015) 1px,
        transparent 1px,
        transparent 16px
      );
    }
    
    .aurora-bloom {
      background: 
        radial-gradient(circle at 50% 65%, rgba(255, 107, 74, 0.28) 0%, rgba(249, 115, 22, 0.15) 24%, transparent 55%),
        radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.35) 0%, transparent 50%),
        radial-gradient(circle at 80% 25%, rgba(6, 182, 212, 0.32) 0%, transparent 45%),
        radial-gradient(circle at 50% -10%, rgba(59, 130, 246, 0.25) 0%, transparent 60%),
        #040714;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #040714; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

    @media print {
      body { background: #ffffff !important; color: #111827 !important; }
      .no-print { display: none !important; }
      .print-card { border: 1px solid #e5e7eb !important; background: #ffffff !important; color: #111827 !important; }
    }
  </style>
</head>

<body class="bg-midnight text-slate-100 font-sans antialiased selection:bg-aura-cyan/30 selection:text-white min-h-screen overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SUPABASE CLIENT SETUP ---
    const SUPABASE_URL = 'https://rcnnuvhwzfbntkkizaai.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjbm51dmh3emZibnRra2l6YWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzk1NDYsImV4cCI6MjEwODk1NTU0Nn0.4yTn-ZKE0cTd10MnjVtZnhtGqis2a7B65XQ0WCbbJdo';
    
    const supabase = (window.supabase && SUPABASE_URL.indexOf('YOUR_PROJECT_ID') === -1)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const STORAGE_KEY = 'crewos_db_v6';

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { currency: 'INR', currencySymbol: '₹', projects: [] };
    }

    function saveDB(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function CrewOSApp() {
      const [db, setDb] = useState(loadDB);
      const [view, setView] = useState('landing');
      const [activeProjectId, setActiveProjectId] = useState(null);
      const [activeProjectTab, setActiveProjectTab] = useState('overview');
      const [isAIModalOpen, setIsAIModalOpen] = useState(false);
      const [inviteModalOpen, setInviteModalOpen] = useState(false);
      const [joinModalOpen, setJoinModalOpen] = useState(false);
      const [joinCodeInput, setJoinCodeInput] = useState('');
      const [copiedCode, setCopiedCode] = useState(false);
      const [toast, setToast] = useState(null);

      // Auth states
      const [authUser, setAuthUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('signin');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      const updateDb = (newDb) => {
        setDb(newDb);
        saveDB(newDb);
      };

      // Lucide icon dynamic reload
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // --- SUPABASE SESSION SYNC ---
      useEffect(() => {
        if (!supabase) return;

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            setAuthUser(session.user);
            if (view === 'landing') setView('dashboard');
          } else {
            setAuthUser(null);
            setView('landing');
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session?.user) {
            setAuthUser(session.user);
            setAuthModalOpen(false);
            if (view === 'landing') setView('dashboard');
          } else {
            setAuthUser(null);
            setView('landing');
          }
        });

        return () => subscription.unsubscribe();
      }, [view]);

      // --- FETCH DATA FROM SUPABASE CLUSTER (LOGGED IN USERS ONLY) ---
      useEffect(() => {
        if (!supabase || !authUser) return;

        async function fetchRemoteData() {
          try {
            const { data: remoteProjects, error } = await supabase
              .from('projects')
              .select('*, tasks (*), decisions (*), expenses (*)');

            if (error) {
              console.warn('Supabase fetch notice:', error.message);
              return;
            }

            if (remoteProjects) {
              const formatted = remoteProjects.map(p => ({
                id: p.id,
                name: p.name,
                tagline: p.tagline,
                category: p.category,
                status: p.status || 'Active',
                startDate: p.start_date,
                targetDate: p.target_date,
                totalBudget: Number(p.total_budget || 0),
                progress: p.progress || 0,
                members: [
                  { 
                    id: authUser.id, 
                    name: authUser.user_metadata?.full_name || authUser.email.split('@')[0], 
                    role: 'Owner', 
                    title: 'Mission Commander', 
                    avatar: (authUser.email.substring(0, 2)).toUpperCase(), 
                    email: authUser.email 
                  }
                ],
                tasks: (p.tasks || []).map(t => ({
                  id: t.id,
                  title: t.title,
                  column: t.column_name,
                  priority: t.priority,
                  assignee: t.assignee,
                  dueDate: t.due_date,
                  checklist: []
                })),
                decisions: (p.decisions || []).map(d => ({
                  ...d,
                  approvedBy: d.approved_by
                })),
                expenses: p.expenses || [],
                resources: [],
                activity: []
              }));

              setDb(prev => ({ ...prev, projects: formatted }));
              if (formatted.length > 0 && !activeProjectId) {
                setActiveProjectId(formatted[0].id);
              }
            }
          } catch (err) {
            console.error('Supabase fetch failed:', err);
          }
        }

        fetchRemoteData();
      }, [authUser]);

      // --- EMAIL AUTH METHODS ---
      const handleEmailAuth = async (e) => {
        e.preventDefault();
        if (!supabase) return;
        setAuthLoading(true);
        setAuthError('');

        try {
          if (authMode === 'signup') {
            const { data, error } = await supabase.auth.signUp({
              email: authEmail,
              password: authPassword,
              options: { data: { full_name: authEmail.split('@')[0] } }
            });
            if (error) throw error;
            if (data?.session) {
              setAuthUser(data.session.user);
              setAuthModalOpen(false);
              setView('dashboard');
              showToast('Account created & logged in.');
            } else {
              showToast('Please check your email, or turn off "Confirm email" in Supabase.');
            }
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: authEmail,
              password: authPassword
            });
            if (error) throw error;
            setAuthUser(data.user);
            setAuthModalOpen(false);
            setView('dashboard');
            showToast(`Welcome back, ${data.user.email.split('@')[0]}!`);
          }
        } catch (err) {
          setAuthError(err.message || 'Authentication failed');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignOut = async () => {
        if (!supabase) return;
        await supabase.auth.signOut();
        setAuthUser(null);
        setView('landing');
        showToast('Signed out successfully');
      };

      // Strict guest block for any restricted view
      const protectAction = (targetView) => {
        if (!authUser) {
          setAuthError('');
          setAuthMode('signin');
          setAuthModalOpen(true);
        } else {
          setView(targetView);
        }
      };

      const project = useMemo(() => {
        return db.projects.find(p => p.id === activeProjectId) || db.projects[0] || null;
      }, [db.projects, activeProjectId]);

      const budgetMetrics = useMemo(() => {
        if (!project) return { spent: 0, planned: 0, remaining: 0, percent: 0 };
        const spent = project.expenses.filter(e => e.status === 'Paid').reduce((acc, c) => acc + c.amount, 0);
        const planned = project.expenses.filter(e => e.status === 'Planned').reduce((acc, c) => acc + c.amount, 0);
        const remaining = Math.max(0, project.totalBudget - spent);
        const percent = project.totalBudget > 0 ? Math.round((spent / project.totalBudget) * 100) : 0;
        return { spent, planned, remaining, percent };
      }, [project]);

      const taskMetrics = useMemo(() => {
        if (!project || !project.tasks.length) return { total: 0, done: 0, progress: 0, urgent: 0 };
        const total = project.tasks.length;
        const done = project.tasks.filter(t => t.column === 'done').length;
        const urgent = project.tasks.filter(t => t.priority === 'urgent' && t.column !== 'done').length;
        return { total, done, progress: Math.round((done / total) * 100), urgent };
      }, [project]);

      const formatCurrency = (amt) => `${db.currencySymbol || '₹'}${Number(amt).toLocaleString()}`;

      // Mission code generator from ID
      const getMissionCode = (projId) => {
        if (!projId) return 'CREW-01';
        return projId.replace('proj-', '').substring(0, 8).toUpperCase();
      };

      const handleJoinWithCode = (e) => {
        e.preventDefault();
        const code = joinCodeInput.trim().toLowerCase();
        const found = db.projects.find(p => p.id.toLowerCase().includes(code) || getMissionCode(p.id).toLowerCase() === code);
        if (found) {
          setActiveProjectId(found.id);
          setView('project');
          setJoinModalOpen(false);
          setJoinCodeInput('');
          showToast(`Entered mission workspace: ${found.name}`);
        } else {
          showToast('Mission code not found. Create a mission or verify code.');
        }
      };

      return (
        <div className="relative min-h-screen bg-midnight text-slate-100 selection:bg-cyan-500/30 overflow-x-hidden">
          <div className="fixed inset-0 fluted-overlay pointer-events-none z-10 opacity-70"></div>

          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl bg-surface-elevated/95 border border-white/20 text-white shadow-glass backdrop-blur-xl animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-aura-cyan shadow-[0_0_10px_#06b6d4]"></span>
              <span className="text-sm font-medium">{toast}</span>
            </div>
          )}

          {/* Top Floating Glass Navigation Bar */}
          <header className="sticky top-0 z-40 w-full px-4 sm:px-8 py-3.5 backdrop-blur-2xl bg-midnight/65 border-b border-white/[0.08] transition-all">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              <div onClick={() => setView(authUser ? 'dashboard' : 'landing')} className="flex items-center gap-3.5 cursor-pointer group">
                <div className="relative w-9 h-9 rounded-2xl bg-gradient-to-tr from-aura-blue via-aura-cyan to-aura-coral p-[1px] shadow-glow-cyan transition-transform group-hover:scale-105">
                  <div className="w-full h-full bg-midnight rounded-2xl flex items-center justify-center font-bold text-aura-sky">⌘</div>
                </div>
                <div>
                  <span className="text-xl font-bold tracking-tight text-white flex items-center gap-1.5 font-sans">
                    CrewOS <span className="text-xs px-2 py-0.5 rounded-full bg-aura-cyan/15 text-aura-cyan border border-aura-cyan/30 font-mono tracking-normal">2.4</span>
                  </span>
                </div>
              </div>

              {/* Navigation: Strictly hidden for unauthenticated guests */}
              {authUser ? (
                <nav className="hidden md:flex items-center gap-1 px-4 py-1.5 rounded-full bg-surface-glass border border-white/[0.1] backdrop-blur-xl shadow-glass text-sm">
                  <button onClick={() => setView('dashboard')} className={`px-3.5 py-1 rounded-full transition-all ${view === 'dashboard' ? 'bg-white/10 text-white font-medium' : 'text-slate-400 hover:text-white'}`}>Dashboard</button>
                  <button onClick={() => { if (!project) { setView('new-project'); } else { setView('project'); setActiveProjectTab('tasks'); } }} className={`px-3.5 py-1 rounded-full transition-all ${view === 'project' ? 'bg-white/10 text-white font-medium' : 'text-slate-400 hover:text-white'}`}>Workspace</button>
                  <button onClick={() => setIsAIModalOpen(true)} className="px-3.5 py-1 rounded-full text-aura-coral hover:text-white flex items-center gap-1.5">⚡ AI Planner</button>
                  <button onClick={() => setJoinModalOpen(true)} className="px-3 py-1 rounded-full text-aura-sky hover:text-white text-xs font-mono"># Join Code</button>
                </nav>
              ) : null}

              {/* Right User Bar / Auth Trigger */}
              <div className="flex items-center gap-3">
                {authUser ? (
                  <div className="flex items-center gap-2.5">
                    <button onClick={() => setView('new-project')} className="px-3.5 py-1.5 rounded-full bg-aura-blue/20 hover:bg-aura-blue/30 border border-aura-blue/40 text-xs font-semibold text-aura-sky transition-all flex items-center gap-1.5">+ New Mission</button>
                    <div title={`Logged in as ${authUser.email}`} className="w-8 h-8 rounded-full bg-gradient-to-tr from-aura-coral to-aura-cyan flex items-center justify-center font-bold text-xs text-midnight shadow-glow-coral">
                      {authUser.email.substring(0, 2).toUpperCase()}
                    </div>
                    <button onClick={handleSignOut} className="text-xs text-slate-400 hover:text-white px-2 py-1">Sign Out</button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button onClick={() => { setAuthError(''); setAuthMode('signin'); setAuthModalOpen(true); }} className="px-4 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition-all">Sign In</button>
                    <button onClick={() => { setAuthError(''); setAuthMode('signup'); setAuthModalOpen(true); }} className="px-4 py-1.5 rounded-full text-xs font-bold text-white bg-gradient-to-r from-aura-blue to-aura-cyan shadow-glow-cyan hover:scale-105 transition-all">Get Started</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* VIEW: MARKETING HERO (SHOWN TO GUESTS) */}
          {view === 'landing' && (
            <main className="relative">
              <section className="relative min-h-[92vh] flex flex-col justify-center items-center px-4 sm:px-6 pt-12 pb-24 aurora-bloom overflow-hidden text-center">
                
                <div className="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none">
                  <svg className="w-full h-full max-w-6xl" viewBox="0 0 1000 600" fill="none">
                    <path d="M 100 300 Q 250 150, 500 320 T 900 280" stroke="url(#hero-grad-cyan)" strokeWidth="1.5" strokeDasharray="4 6" />
                    <path d="M 50 380 Q 300 480, 550 300 T 950 360" stroke="url(#hero-grad-coral)" strokeWidth="1.5" />
                    <defs>
                      <linearGradient id="hero-grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.2" />
                        <stop offset="50%" stopColor="#38BDF8" stopOpacity="0.9" />
                        <stop offset="100%" stopColor="#2563EB" stopOpacity="0.1" />
                      </linearGradient>
                      <linearGradient id="hero-grad-coral" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stopColor="#FF6B4A" stopOpacity="0.1" />
                        <stop offset="60%" stopColor="#F97316" stopOpacity="0.8" />
                        <stop offset="100%" stopColor="#FDA4AF" stopOpacity="0.2" />
                      </linearGradient>
                    </defs>
                  </svg>
                </div>

                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/[0.05] border border-white/15 backdrop-blur-xl text-xs font-semibold uppercase text-slate-300 mb-8 shadow-glass">
                  <span className="w-2 h-2 rounded-full bg-aura-cyan shadow-[0_0_8px_#06b6d4]"></span>
                  The Operating System for Teams on a Mission
                </div>

                <div className="max-w-4xl mx-auto px-4 z-20">
                  <h1 className="font-display italic text-5xl sm:text-7xl lg:text-8xl text-white font-normal leading-[1.08] mb-6">
                    Great things don’t <br className="hidden sm:inline" />
                    <span className="font-sans not-italic font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400">happen alone.</span>
                  </h1>

                  <p className="max-w-2xl mx-auto text-base sm:text-xl text-slate-300 font-light mb-10 leading-relaxed">
                    One space for your crew, your plans, your decisions, and everything it takes to make something happen.
                  </p>

                  <div className="flex flex-col sm:flex-row items-center justify-center gap-5 mb-8">
                    <button onClick={() => protectAction('dashboard')} className="w-full sm:w-auto px-8 py-3.5 rounded-full font-semibold text-white bg-gradient-to-r from-aura-blue via-aura-cyan to-aura-coral shadow-glow-cyan hover:scale-[1.02] transition-all">Start a crew workspace ↗</button>
                    <button onClick={() => { setAuthError(''); setAuthMode('signin'); setAuthModalOpen(true); }} className="w-full sm:w-auto px-8 py-3.5 rounded-full font-medium text-slate-200 bg-white/[0.04] border border-white/15 backdrop-blur-xl hover:bg-white/[0.08] transition-all">Sign In with Account</button>
                  </div>

                  <p className="text-xs tracking-widest uppercase text-slate-400 font-mono">
                    From first idea to final handover. Authentication required for squad access.
                  </p>
                </div>
              </section>
            </main>
          )}

          {/* VIEW: MAIN DASHBOARD (AUTHENTICATED ONLY) */}
          {view === 'dashboard' && authUser && (
            <main className="max-w-7xl mx-auto px-4 sm:px-8 py-8 animate-fade-in">
              <div className="flex flex-col md:flex-row md:items-center justify-between pb-8 border-b border-white/10 gap-4">
                <div>
                  <h1 className="text-3xl sm:text-4xl font-bold text-white">Mission Command</h1>
                  <p className="text-sm text-slate-400 mt-1">Logged in as {authUser.email}</p>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={() => setJoinModalOpen(true)} className="px-4 py-2.5 rounded-full bg-white/[0.04] border border-white/15 text-xs font-semibold text-aura-sky"># Enter Mission Code</button>
                  <button onClick={() => setIsAIModalOpen(true)} className="px-4 py-2.5 rounded-full bg-white/[0.04] border border-white/15 text-xs font-semibold text-aura-coral flex items-center gap-2">⚡ AI Breakdown</button>
                  <button onClick={() => setView('new-project')} className="px-5 py-2.5 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">+ Create Project</button>
                </div>
              </div>

              {db.projects.length === 0 ? (
                <div className="p-12 text-center rounded-3xl bg-surface-glass border border-dashed border-white/15 mt-8">
                  <h3 className="text-lg font-bold text-white mb-2">No missions yet</h3>
                  <p className="text-xs text-slate-400 mb-6">Create your squad workspace or join a teammate's mission with their code.</p>
                  <div className="flex justify-center gap-3">
                    <button onClick={() => setView('new-project')} className="px-5 py-2.5 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">Create First Mission</button>
                    <button onClick={() => setJoinModalOpen(true)} className="px-5 py-2.5 rounded-full bg-white/10 text-xs font-semibold text-white">Enter Mission Code</button>
                  </div>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                  {db.projects.map(proj => (
                    <div key={proj.id} onClick={() => { setActiveProjectId(proj.id); setView('project'); }} className="p-6 rounded-3xl bg-surface-glass border border-white/10 hover:border-aura-cyan/50 backdrop-blur-2xl transition-all cursor-pointer shadow-glass">
                      <div className="flex justify-between items-start">
                        <span className="text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-full bg-aura-blue/20 text-aura-sky font-semibold">{proj.category}</span>
                        <span className="font-mono text-[10px] px-2 py-0.5 rounded bg-white/5 border border-white/10 text-slate-400">Code: {getMissionCode(proj.id)}</span>
                      </div>
                      <h3 className="text-xl font-bold text-white mt-2">{proj.name}</h3>
                      <p className="text-xs text-slate-300 mt-1">{proj.tagline}</p>
                      <div className="mt-6 flex justify-between text-xs font-mono text-slate-400">
                        <span>Target: {proj.targetDate}</span>
                        <span className="text-aura-cyan font-bold">{proj.tasks.length} tasks</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* VIEW: CREATE PROJECT WIZARD */}
          {view === 'new-project' && authUser && (
            <main className="max-w-2xl mx-auto px-4 py-10 animate-fade-in">
              <h1 className="text-3xl font-bold text-white mb-6">New Mission Workspace</h1>
              <form onSubmit={async (e) => {
                e.preventDefault();
                const form = e.target;
                const newProj = {
                  id: `proj-${Date.now()}`,
                  name: form.projName.value,
                  tagline: form.projTagline.value,
                  category: form.projCategory.value,
                  status: 'Active',
                  startDate: new Date().toISOString().split('T')[0],
                  targetDate: form.projTargetDate.value,
                  totalBudget: Number(form.projBudget.value) || 100000,
                  progress: 0,
                  members: [{ id: authUser.id, name: authUser.email.split('@')[0], role: 'Owner', title: 'Lead', avatar: (authUser.email.substring(0, 2)).toUpperCase(), email: authUser.email }],
                  tasks: [],
                  decisions: [],
                  expenses: [],
                  resources: [],
                  activity: []
                };

                updateDb({ ...db, projects: [newProj, ...db.projects] });
                setActiveProjectId(newProj.id);
                setView('project');

                if (supabase) {
                  await supabase.from('projects').insert([{
                    id: newProj.id,
                    name: newProj.name,
                    tagline: newProj.tagline,
                    category: newProj.category,
                    status: newProj.status,
                    start_date: newProj.startDate,
                    target_date: newProj.targetDate,
                    total_budget: newProj.totalBudget,
                    progress: newProj.progress
                  }]);
                }
                showToast(`Mission workspace initialized: ${newProj.name}`);
              }} className="space-y-4 p-8 rounded-3xl bg-surface-glass border border-white/10 shadow-glass">
                <div>
                  <label className="text-xs uppercase text-slate-400 block mb-1">Project Name</label>
                  <input name="projName" required placeholder="Project Atlas" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white outline-none focus:border-aura-cyan" />
                </div>
                <div>
                  <label className="text-xs uppercase text-slate-400 block mb-1">Mission Objective</label>
                  <input name="projTagline" required placeholder="Rapid sprint squad execution." className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white outline-none focus:border-aura-cyan" />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs uppercase text-slate-400 block mb-1">Category</label>
                    <select name="projCategory" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white">
                      <option value="Startup Launch">Startup Launch</option>
                      <option value="Hackathon">Hackathon</option>
                      <option value="Event Planning">Event</option>
                      <option value="Content Production">Content</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs uppercase text-slate-400 block mb-1">Target Date</label>
                    <input type="date" name="projTargetDate" defaultValue="2026-12-31" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white" />
                  </div>
                </div>
                <div>
                  <label className="text-xs uppercase text-slate-400 block mb-1">Estimated Budget ({db.currency})</label>
                  <input type="number" name="projBudget" defaultValue="250000" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white" />
                </div>
                <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-aura-blue to-aura-cyan font-bold text-white mt-4 shadow-glow-cyan">Launch Workspace ↗</button>
              </form>
            </main>
          )}

          {/* VIEW: PROJECT WORKSPACE */}
          {view === 'project' && authUser && project && (
            <main className="max-w-7xl mx-auto px-4 sm:px-8 py-6 animate-fade-in">
              <div className="p-6 rounded-[2.5rem] bg-surface-glass border border-white/15 backdrop-blur-2xl mb-6 shadow-glass">
                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-mono uppercase px-2.5 py-0.5 rounded-full bg-aura-blue/20 text-aura-sky font-semibold">{project.category}</span>
                      <span className="text-xs font-mono text-slate-400 px-2 py-0.5 rounded bg-white/5 border border-white/10">Code: {getMissionCode(project.id)}</span>
                    </div>
                    <h1 className="text-3xl font-bold text-white mt-2">{project.name}</h1>
                    <p className="text-xs text-slate-300 mt-1">{project.tagline}</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setInviteModalOpen(true)} className="px-4 py-2 rounded-full bg-white/10 text-xs font-semibold text-white">+ Mission Code</button>
                    <button onClick={() => setIsAIModalOpen(true)} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-coral to-aura-sunset text-xs font-bold text-white shadow-glow-coral">⚡ AI Plan</button>
                  </div>
                </div>

                <div className="flex gap-2 mt-6 pt-4 border-t border-white/10 overflow-x-auto text-xs">
                  {['overview', 'tasks', 'decisions', 'budget'].map(tab => (
                    <button key={tab} onClick={() => setActiveProjectTab(tab)} className={`px-4 py-2 rounded-full capitalize font-semibold transition-all ${activeProjectTab === tab ? 'bg-white text-midnight' : 'text-slate-400 hover:text-white'}`}>
                      {tab}
                    </button>
                  ))}
                </div>
              </div>

              {/* OVERVIEW TAB */}
              {activeProjectTab === 'overview' && (
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  <div className="p-6 rounded-3xl bg-surface-glass border border-white/10">
                    <span className="text-xs font-mono text-slate-400 uppercase">Mission Velocity</span>
                    <div className="text-3xl font-bold text-white mt-2">{taskMetrics.progress}%</div>
                    <div className="w-full bg-white/10 h-2 rounded-full mt-3 overflow-hidden">
                      <div className="bg-aura-cyan h-full rounded-full" style={{ width: `${taskMetrics.progress}%` }}></div>
                    </div>
                  </div>
                  <div className="p-6 rounded-3xl bg-surface-glass border border-white/10">
                    <span className="text-xs font-mono text-slate-400 uppercase">Budget Expended</span>
                    <div className="text-3xl font-bold text-aura-sky mt-2">{formatCurrency(budgetMetrics.spent)}</div>
                    <div className="text-xs text-slate-400 mt-1">Remaining: {formatCurrency(budgetMetrics.remaining)}</div>
                  </div>
                  <div className="p-6 rounded-3xl bg-surface-glass border border-white/10">
                    <span className="text-xs font-mono text-slate-400 uppercase">Signed Decisions</span>
                    <div className="text-3xl font-bold text-aura-coral mt-2">{project.decisions.length} Locked</div>
                    <div className="text-xs text-emerald-400 mt-1">Consensus recorded</div>
                  </div>
                </div>
              )}

              {/* TASKS TAB */}
              {activeProjectTab === 'tasks' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Sprint Task Board</h2>
                    <button onClick={async () => {
                      const title = prompt('Task title:');
                      if (!title) return;
                      const newTask = {
                        id: `t-${Date.now()}`,
                        title,
                        column: 'todo',
                        priority: 'high',
                        assignee: authUser.email.split('@')[0],
                        dueDate: '2026-11-20',
                        checklist: []
                      };
                      const updatedProjects = db.projects.map(p => p.id === project.id ? { ...p, tasks: [newTask, ...p.tasks] } : p);
                      updateDb({ ...db, projects: updatedProjects });

                      if (supabase) {
                        await supabase.from('tasks').insert([{
                          id: newTask.id,
                          project_id: project.id,
                          title: newTask.title,
                          column_name: newTask.column,
                          priority: newTask.priority,
                          assignee: newTask.assignee,
                          due_date: newTask.dueDate
                        }]);
                      }
                      showToast(`Task created: ${title}`);
                    }} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">+ Add Task</button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    {['todo', 'in_progress', 'review', 'done'].map(col => {
                      const colTasks = project.tasks.filter(t => t.column === col);
                      return (
                        <div key={col} className="p-4 rounded-3xl bg-surface-glass border border-white/10">
                          <h4 className="text-xs font-bold uppercase text-slate-400 mb-3">{col.replace('_', ' ')} ({colTasks.length})</h4>
                          <div className="space-y-3">
                            {colTasks.map(t => (
                              <div key={t.id} className="p-3.5 rounded-2xl bg-surface-elevated border border-white/10 text-xs">
                                <div className="font-semibold text-white">{t.title}</div>
                                <div className="text-[10px] text-slate-400 mt-2 flex justify-between items-center">
                                  <span>{t.assignee}</span>
                                  <select value={t.column} onChange={async (e) => {
                                    const newCol = e.target.value;
                                    const updatedTasks = project.tasks.map(x => x.id === t.id ? { ...x, column: newCol } : x);
                                    updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, tasks: updatedTasks } : p) });
                                    if (supabase) await supabase.from('tasks').update({ column_name: newCol }).eq('id', t.id);
                                  }} className="bg-midnight text-aura-cyan rounded px-1 outline-none">
                                    <option value="todo">To Do</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="review">Review</option>
                                    <option value="done">Done</option>
                                  </select>
                                </div>
                              </div>
                            ))}
                            {colTasks.length === 0 && (
                              <div className="p-6 text-center text-xs text-slate-600 border border-dashed border-white/10 rounded-2xl">
                                Empty
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* DECISIONS TAB */}
              {activeProjectTab === 'decisions' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Signed Decisions</h2>
                    <button onClick={async () => {
                      const title = prompt('Decision topic:');
                      if (!title) return;
                      const chosen = prompt('Chosen option:') || '';
                      const rationale = prompt('Rationale:') || '';
                      const newDec = {
                        id: `dec-${Date.now()}`,
                        title,
                        context: 'Recorded via alignment meeting.',
                        chosen,
                        rationale,
                        status: 'Approved',
                        owner: authUser.email.split('@')[0],
                        approvedBy: authUser.email.split('@')[0],
                        date: new Date().toISOString().split('T')[0]
                      };
                      updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, decisions: [newDec, ...p.decisions] } : p) });
                      if (supabase) {
                        await supabase.from('decisions').insert([{
                          id: newDec.id,
                          project_id: project.id,
                          title: newDec.title,
                          context: newDec.context,
                          chosen: newDec.chosen,
                          rationale: newDec.rationale,
                          status: newDec.status,
                          owner: newDec.owner,
                          approved_by: newDec.approvedBy,
                          date: newDec.date
                        }]);
                      }
                      showToast('Decision recorded in Supabase!');
                    }} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-coral to-aura-sunset text-xs font-bold text-white shadow-glow-coral">+ Record Decision</button>
                  </div>

                  <div className="space-y-3">
                    {project.decisions.map(d => (
                      <div key={d.id} className="p-5 rounded-3xl bg-surface-glass border border-white/10 text-xs">
                        <div className="flex justify-between font-bold text-white text-sm mb-2">
                          <span>{d.title}</span>
                          <span className="text-emerald-400 font-mono text-xs">{d.status}</span>
                        </div>
                        <p className="text-slate-300"><strong>Chosen:</strong> {d.chosen}</p>
                        <p className="text-slate-400 mt-1"><strong>Reason:</strong> {d.rationale}</p>
                        <div className="mt-3 text-[10px] font-mono text-slate-500">Signed by {d.approvedBy} on {d.date}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* BUDGET TAB */}
              {activeProjectTab === 'budget' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-white">Budget Ledger</h2>
                      <p className="text-xs text-slate-400">Total: {formatCurrency(project.totalBudget)} | Spent: {formatCurrency(budgetMetrics.spent)}</p>
                    </div>
                    <button onClick={async () => {
                      const title = prompt('Expense description:');
                      if (!title) return;
                      const amount = Number(prompt('Amount:')) || 0;
                      const newExp = {
                        id: `exp-${Date.now()}`,
                        title,
                        category: 'Operations',
                        amount,
                        date: new Date().toISOString().split('T')[0],
                        payer: authUser.email.split('@')[0],
                        status: 'Paid'
                      };
                      updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, expenses: [newExp, ...p.expenses] } : p) });
                      if (supabase) {
                        await supabase.from('expenses').insert([{
                          id: newExp.id,
                          project_id: project.id,
                          title: newExp.title,
                          category: newExp.category,
                          amount: newExp.amount,
                          payer: newExp.payer,
                          date: newExp.date,
                          status: newExp.status
                        }]);
                      }
                      showToast('Expense recorded!');
                    }} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">+ Add Expense</button>
                  </div>

                  <div className="p-4 rounded-3xl bg-surface-glass border border-white/10 overflow-x-auto text-xs">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b border-white/10 text-slate-400 font-mono">
                          <th className="pb-2">Description</th>
                          <th className="pb-2">Payer</th>
                          <th className="pb-2 text-right">Amount</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {project.expenses.map(e => (
                          <tr key={e.id}>
                            <td className="py-2.5 font-semibold text-white">{e.title}</td>
                            <td className="py-2.5 text-slate-400">{e.payer}</td>
                            <td className="py-2.5 text-right font-mono text-aura-cyan font-bold">{formatCurrency(e.amount)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          )}

          {/* AUTH MODAL (DIRECT EMAIL & PASSWORD) */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-2xl animate-fade-in">
              <div className="w-full max-w-sm p-6 sm:p-8 rounded-[2rem] bg-surface-elevated border border-white/20 shadow-glow-cyan">
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h3 className="text-xl font-bold text-white">{authMode === 'signin' ? 'Sign In' : 'Create Account'}</h3>
                    <p className="text-xs text-slate-400 mt-1">{authMode === 'signin' ? 'Access your mission workspace' : 'Create squad mission account'}</p>
                  </div>
                  <button onClick={() => setAuthModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {authError && (
                  <div className="p-2.5 mb-4 rounded-lg bg-red-500/10 border border-red-500/20 text-xs text-red-400">
                    {authError}
                  </div>
                )}

                <form onSubmit={handleEmailAuth} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Email</label>
                    <input type="email" required value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="name@domain.com" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-xs text-white placeholder-slate-500 outline-none focus:border-aura-cyan" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Password</label>
                    <input type="password" required minLength="6" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-xs text-white placeholder-slate-500 outline-none focus:border-aura-cyan" />
                  </div>

                  <button type="submit" disabled={authLoading} className="w-full py-3 rounded-xl bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan hover:scale-[1.02] transition-all disabled:opacity-50">
                    {authLoading ? 'Verifying...' : (authMode === 'signin' ? 'Sign In ↗' : 'Create Free Account ↗')}
                  </button>
                </form>

                <div className="mt-6 pt-4 border-t border-white/10 text-center text-xs text-slate-400">
                  {authMode === 'signin' ? (
                    <span>Don't have an account? <button onClick={() => { setAuthError(''); setAuthMode('signup'); }} className="text-aura-cyan font-semibold hover:underline">Sign up</button></span>
                  ) : (
                    <span>Already have an account? <button onClick={() => { setAuthError(''); setAuthMode('signin'); }} className="text-aura-cyan font-semibold hover:underline">Sign in</button></span>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* AI MODAL */}
          {isAIModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-2xl">
              <div className="w-full max-w-lg p-6 rounded-[2rem] bg-surface-elevated border border-white/20">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">AI Sprint Planning</h3>
                  <button onClick={() => setIsAIModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <textarea rows="3" defaultValue="Deploy beta client onboarding portal and safety compliance checks in 3 weeks." className="w-full p-3 rounded-xl bg-midnight border border-white/15 text-xs text-white mb-4 outline-none focus:border-aura-cyan"></textarea>
                <button onClick={async () => {
                  if (!project) return;
                  const aiTask = {
                    id: `t-ai-${Date.now()}`,
                    title: 'Conduct automated safety compliance check audit',
                    column: 'todo',
                    priority: 'urgent',
                    assignee: authUser ? authUser.email.split('@')[0] : 'Lead',
                    dueDate: '2026-11-25',
                    checklist: []
                  };
                  updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, tasks: [aiTask, ...p.tasks] } : p) });
                  if (supabase) {
                    await supabase.from('tasks').insert([{
                      id: aiTask.id,
                      project_id: project.id,
                      title: aiTask.title,
                      column_name: aiTask.column,
                      priority: aiTask.priority,
                      assignee: aiTask.assignee,
                      due_date: aiTask.dueDate
                    }]);
                  }
                  setIsAIModalOpen(false);
                  showToast('AI synthesized sprint task scheduled!');
                }} className="w-full py-2.5 rounded-xl bg-gradient-to-r from-aura-coral to-aura-sunset font-bold text-xs text-white">
                  Synthesize Sprint Tasks ↗
                </button>
              </div>
            </div>
          )}

          {/* INVITE CODE MODAL */}
          {inviteModalOpen && project && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-xl">
              <div className="w-full max-w-sm p-6 rounded-3xl bg-surface-elevated border border-white/20 shadow-glass text-center">
                <div className="flex justify-between items-center mb-3 text-left">
                  <h3 className="text-base font-bold text-white">Mission Crew Code</h3>
                  <button onClick={() => setInviteModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <p className="text-xs text-slate-300 mb-4 text-left">
                  Teammates can use this mission code from their dashboard to join this workspace:
                </p>
                <div className="p-4 rounded-2xl bg-midnight border border-white/15 flex items-center justify-between mb-4">
                  <span className="font-mono text-xl font-bold tracking-widest text-aura-cyan">{getMissionCode(project.id)}</span>
                  <button onClick={() => {
                    navigator.clipboard.writeText(getMissionCode(project.id));
                    setCopiedCode(true);
                    setTimeout(() => setCopiedCode(false), 2000);
                    showToast('Mission code copied!');
                  }} className="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-semibold text-white">
                    {copiedCode ? 'Copied ✓' : 'Copy'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* JOIN MISSION MODAL */}
          {joinModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-xl">
              <div className="w-full max-w-sm p-6 rounded-3xl bg-surface-elevated border border-white/20 shadow-glass">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-base font-bold text-white">Enter Mission Code</h3>
                  <button onClick={() => setJoinModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <form onSubmit={handleJoinWithCode} className="space-y-4">
                  <input 
                    type="text" 
                    required 
                    placeholder="e.g. ATLAS-9X" 
                    value={joinCodeInput} 
                    onChange={e => setJoinCodeInput(e.target.value)} 
                    className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-sm text-white font-mono uppercase tracking-wider outline-none focus:border-aura-cyan"
                  />
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white">
                    Join Workspace →
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CrewOSApp />);
  </script>
</body>
</html>

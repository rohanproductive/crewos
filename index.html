                    </div>
                  </div>
                </div>
              )}

            </main>
          )}


          {/* ========================================================
              MODAL: CREW INVITE SYSTEM
             ======================================================== */}
          {inviteModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-xl animate-fade-in">
              <div className="w-full max-w-md p-6 rounded-3xl bg-surface-elevated border border-white/20 shadow-glass">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">Invite Crew Members</h3>
                  <button onClick={() => setInviteModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <p className="text-xs text-slate-300 mb-4 leading-relaxed">
                  Share this zero-install link. Anyone with this mission key can view and contribute to tasks according to assigned permissions.
                </p>

                <div className="p-3 rounded-2xl bg-midnight border border-white/15 flex items-center justify-between mb-4">
                  <span className="text-xs font-mono text-aura-cyan truncate">https://crewos.local/join/{project.id}</span>
                  <button 
                    onClick={() => {
                      navigator.clipboard.writeText(`https://crewos.local/join/${project.id}`);
                      setInviteCopied(true);
                      setTimeout(() => setInviteCopied(false), 2000);
                      showToast('Invitation link copied to clipboard!');
                    }}
                    className="ml-2 px-3 py-1 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold text-white whitespace-nowrap"
                  >
                    {inviteCopied ? 'Copied ✓' : 'Copy'}
                  </button>
                </div>

                <div className="space-y-3 pt-3 border-t border-white/10">
                  <label className="block text-xs font-semibold text-slate-300">Or send direct invitation:</label>
                  <input 
                    placeholder="teammate@organization.com"
                    id="inviteEmailInput"
                    className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-xs text-white outline-none focus:border-aura-cyan"
                  />
                  <button 
                    onClick={() => {
                      const input = document.getElementById('inviteEmailInput');
                      if (input && input.value) {
                        showToast(`Invitation queued for ${input.value}`);
                        input.value = '';
                        setInviteModalOpen(false);
                      }
                    }}
                    className="w-full py-2.5 rounded-xl bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white"
                  >
                    Send Invitation Link
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* ========================================================
              MODAL: CREWOS AI INTELLIGENCE ENGINE
              1. Brief to Plan Decomposition
              2. Meeting Note Action Item Extraction
              3. Sprint Diagnostic Health Check
             ======================================================== */}
          {isAIModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/85 backdrop-blur-2xl animate-fade-in">
              <div className="w-full max-w-2xl p-6 sm:p-8 rounded-[2.5rem] bg-surface-elevated border border-white/20 shadow-glow-cyan max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-4 border-b border-white/10 mb-6">
                  <div className="flex items-center gap-2.5">
                    <span className="w-3 h-3 rounded-full bg-aura-coral animate-ping"></span>
                    <h3 className="text-xl font-bold text-white">CrewOS AI Intelligence</h3>
                  </div>
                  <button onClick={() => setIsAIModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {/* AI Mode Selector */}
                <div className="flex items-center gap-2 mb-6 p-1 rounded-full bg-midnight border border-white/10 text-xs">
                  <button 
                    onClick={() => setAiMode('plan')} 
                    className={`flex-1 py-1.5 rounded-full font-semibold transition-all ${aiMode === 'plan' ? 'bg-white text-midnight font-bold' : 'text-slate-400'}`}
                  >
                    Goal → Task Plan
                  </button>
                  <button 
                    onClick={() => setAiMode('notes')} 
                    className={`flex-1 py-1.5 rounded-full font-semibold transition-all ${aiMode === 'notes' ? 'bg-white text-midnight font-bold' : 'text-slate-400'}`}
                  >
                    Meeting Notes Extractor
                  </button>
                  <button 
                    onClick={() => setAiMode('health')} 
                    className={`flex-1 py-1.5 rounded-full font-semibold transition-all ${aiMode === 'health' ? 'bg-white text-midnight font-bold' : 'text-slate-400'}`}
                  >
                    Mission Health Scan
                  </button>
                </div>

                {/* MODE 1: Plan Generator */}
                {aiMode === 'plan' && (
                  <div className="space-y-4">
                    <p className="text-xs text-slate-300">
                      Enter a brief mission goal. The assistant will propose structured phases, tasks, owners, and risk mitigation.
                    </p>
                    <textarea 
                      id="aiBriefInput"
                      rows="3"
                      defaultValue="Launch autonomous drone corridor with live ground inspector dashboard in 4 weeks."
                      className="w-full p-3.5 rounded-2xl bg-midnight border border-white/15 text-xs text-white outline-none focus:border-aura-cyan"
                    ></textarea>

                    <button 
                      onClick={() => {
                        const generatedTasks = [
                          { id: `t-ai-${Date.now()}-1`, title: 'Simulate high-wind return-to-base geofence recovery', column: 'todo', priority: 'urgent', assignee: 'Ethan Vance', dueDate: '2026-11-12', checklist: [] },
                          { id: `t-ai-${Date.now()}-2`, title: 'Prepare Municipal inspector compliance checklist', column: 'todo', priority: 'high', assignee: 'Samira Patel', dueDate: '2026-11-14', checklist: [] },
                          { id: `t-ai-${Date.now()}-3`, title: 'Stress test multi-client WebGL telemetry rendering', column: 'todo', priority: 'medium', assignee: 'Maya Chen', dueDate: '2026-11-18', checklist: [] }
                        ];
                        const updatedProjects = db.projects.map(p => p.id === project.id ? { ...p, tasks: [...generatedTasks, ...p.tasks] } : p);
                        updateDb({ ...db, projects: updatedProjects });
                        setIsAIModalOpen(false);
                        showToast('Approved & imported 3 AI-synthesized tasks into Kanban board!');
                      }}
                      className="w-full py-3 rounded-2xl bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan"
                    >
                      Generate & Approve Sprint Tasks ↗
                    </button>
                  </div>
                )}

                {/* MODE 2: Meeting Notes Extractor */}
                {aiMode === 'notes' && (
                  <div className="space-y-4">
                    <p className="text-xs text-slate-300">
                      Paste messy chat transcripts or sprint notes. CrewOS will isolate agreed decisions from action items.
                    </p>
                    <textarea 
                      id="aiNotesInput"
                      rows="4"
                      defaultValue="Jordan: We agreed to switch to 48V battery hubs. Maya will update the harness blueprints by Tuesday. Ethan: Agreed, let's keep budget under 35k."
                      className="w-full p-3.5 rounded-2xl bg-midnight border border-white/15 text-xs text-white outline-none focus:border-aura-cyan"
                    ></textarea>

                    <button 
                      onClick={() => {
                        const newDec = {
                          id: `dec-ai-${Date.now()}`,
                          title: 'Switch to 48V standardized airframe battery hubs',
                          context: 'Extracted from meeting dialogue.',
                          alternatives: ['24V legacy packs'],
                          chosen: '48V standardized airframe battery hubs',
                          rationale: 'Reduces wiring weight while staying under ₹35k budget cap.',
                          status: 'Approved',
                          owner: 'Maya Chen',
                          approvedBy: db.user.name,
                          date: new Date().toISOString().split('T')[0],
                          history: ['Parsed by CrewOS AI from live transcript']
                        };
                        const updatedProjects = db.projects.map(p => p.id === project.id ? { ...p, decisions: [newDec, ...p.decisions] } : p);
                        updateDb({ ...db, projects: updatedProjects });
                        setIsAIModalOpen(false);
                        showToast('Extracted & approved decision: Switch to 48V battery hubs');
                      }}
                      className="w-full py-3 rounded-2xl bg-gradient-to-r from-aura-coral to-aura-sunset text-xs font-bold text-white shadow-glow-coral"
                    >
                      Extract & Approve Locked Decision ↗
                    </button>
                  </div>
                )}

                {/* MODE 3: Health Diagnostic */}
                {aiMode === 'health' && (
                  <div className="space-y-4 text-xs">
                    <div className="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30">
                      <div className="font-bold text-emerald-300 uppercase font-mono text-[10px]">Pace Assessment</div>
                      <p className="text-slate-200 mt-1">
                        Current completion rate is <strong>{taskMetrics.progress}%</strong>. Target trajectory remains on schedule for {project.targetDate}.
                      </p>
                    </div>

                    <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30">
                      <div className="font-bold text-amber-300 uppercase font-mono text-[10px]">Budget Exposure</div>
                      <p className="text-slate-200 mt-1">
                        Spent {formatCurrency(budgetMetrics.spent)} of {formatCurrency(project.totalBudget)} ({budgetMetrics.percent}%). Buffer remains safe.
                      </p>
                    </div>

                    <div className="p-4 rounded-2xl bg-aura-blue/10 border border-aura-blue/30">
                      <div className="font-bold text-aura-sky uppercase font-mono text-[10px]">Action Item Recommendation</div>
                      <p className="text-slate-200 mt-1">
                        Submit Civil Airspace waiver before Nov 02 to prevent ground test delays.
                      </p>
                    </div>

                    <button 
                      onClick={() => setIsAIModalOpen(false)}
                      className="w-full py-2.5 rounded-xl bg-white text-midnight font-bold text-xs"
                    >
                      Close Health Diagnostics
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<CrewOSApp />);
  </script>
</body>
</html>

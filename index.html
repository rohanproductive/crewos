          ],
          recap: null
        }
      ]
    };

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return INITIAL_DATA;
    }

    function saveDB(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function CrewOSApp() {
      const [db, setDb] = useState(loadDB);
      const [view, setView] = useState('landing');
      const [activeProjectId, setActiveProjectId] = useState('proj-atlas');
      const [activeProjectTab, setActiveProjectTab] = useState('overview');
      const [isAIModalOpen, setIsAIModalOpen] = useState(false);
      const [aiMode, setAiMode] = useState('plan');
      const [taskViewMode, setTaskViewMode] = useState('kanban');
      const [taskFilterAssignee, setTaskFilterAssignee] = useState('all');
      const [taskSearch, setTaskSearch] = useState('');
      const [inviteModalOpen, setInviteModalOpen] = useState(false);
      const [inviteCopied, setInviteCopied] = useState(false);
      const [toast, setToast] = useState(null);

      // --- AUTHENTICATION STATE ---
      const [authUser, setAuthUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('signin');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3200);
      };

      const updateDb = (newDb) => {
        setDb(newDb);
        saveDB(newDb);
      };

      // Lucide icon dynamic reload
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // --- SUPABASE AUTH SESSION LISTENER ---
      useEffect(() => {
        if (!supabase) return;

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            setAuthUser(session.user);
            const userEmail = session.user.email || 'user@crewos.local';
            const userName = session.user.user_metadata?.full_name || userEmail.split('@')[0];
            setDb(prev => ({
              ...prev,
              user: {
                id: session.user.id,
                email: userEmail,
                name: userName,
                role: 'Mission Commander',
                avatar: userName.substring(0, 2).toUpperCase()
              }
            }));
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session?.user) {
            setAuthUser(session.user);
            const userEmail = session.user.email || 'user@crewos.local';
            const userName = session.user.user_metadata?.full_name || userEmail.split('@')[0];
            setDb(prev => ({
              ...prev,
              user: {
                id: session.user.id,
                email: userEmail,
                name: userName,
                role: 'Mission Commander',
                avatar: userName.substring(0, 2).toUpperCase()
              }
            }));
          } else {
            setAuthUser(null);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      // --- LOAD DATA FROM SUPABASE POSTGRESQL ---
      useEffect(() => {
        if (!supabase) return;

        async function fetchRemoteData() {
          try {
            const { data: remoteProjects, error } = await supabase
              .from('projects')
              .select('*, tasks (*), decisions (*), expenses (*)');

            if (error) {
              console.warn('Supabase fetch notice:', error.message);
              return;
            }

            if (remoteProjects && remoteProjects.length > 0) {
              const formatted = remoteProjects.map(p => ({
                id: p.id,
                name: p.name,
                tagline: p.tagline,
                category: p.category,
                status: p.status || 'Active',
                startDate: p.start_date,
                targetDate: p.target_date,
                totalBudget: Number(p.total_budget || 0),
                progress: p.progress || 0,
                members: [
                  { id: 'm-101', name: db.user.name, role: 'Owner', title: 'Commander', avatar: db.user.avatar, email: db.user.email }
                ],
                tasks: (p.tasks || []).map(t => ({
                  id: t.id,
                  title: t.title,
                  column: t.column_name,
                  priority: t.priority,
                  assignee: t.assignee,
                  dueDate: t.due_date,
                  checklist: []
                })),
                decisions: (p.decisions || []).map(d => ({
                  ...d,
                  approvedBy: d.approved_by
                })),
                expenses: p.expenses || [],
                resources: [],
                activity: []
              }));

              setDb(prev => ({ ...prev, projects: formatted }));
              showToast('Synced live from Supabase Cloud ✓');
            }
          } catch (err) {
            console.error('Supabase connection error:', err);
          }
        }

        fetchRemoteData();
      }, [authUser]);

      // --- AUTH ACTIONS ---
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        if (!supabase) {
          showToast('Supabase client not initialized.');
          return;
        }
        setAuthLoading(true);

        try {
          if (authMode === 'signup') {
            const { error } = await supabase.auth.signUp({
              email: authEmail,
              password: authPassword,
              options: { data: { full_name: authEmail.split('@')[0] } }
            });
            if (error) throw error;
            showToast('Account created successfully!');
            setAuthModalOpen(false);
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: authEmail,
              password: authPassword
            });
            if (error) throw error;
            showToast(`Welcome back, ${data.user.email.split('@')[0]}!`);
            setAuthModalOpen(false);
          }
        } catch (err) {
          showToast(err.message || 'Authentication failed');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignOut = async () => {
        if (!supabase) return;
        await supabase.auth.signOut();
        setAuthUser(null);
        showToast('Signed out successfully');
      };

      // Active project selector
      const project = useMemo(() => {
        return db.projects.find(p => p.id === activeProjectId) || db.projects[0];
      }, [db.projects, activeProjectId]);

      // Metrics computations
      const budgetMetrics = useMemo(() => {
        if (!project) return { spent: 0, planned: 0, remaining: 0, percent: 0, byCat: {} };
        const spent = project.expenses.filter(e => e.status === 'Paid').reduce((acc, curr) => acc + curr.amount, 0);
        const planned = project.expenses.filter(e => e.status === 'Planned').reduce((acc, curr) => acc + curr.amount, 0);
        const remaining = Math.max(0, project.totalBudget - spent);
        const percent = project.totalBudget > 0 ? Math.round((spent / project.totalBudget) * 100) : 0;
        return { spent, planned, remaining, percent };
      }, [project]);

      const taskMetrics = useMemo(() => {
        if (!project || !project.tasks.length) return { total: 0, done: 0, progress: 0, urgent: 0 };
        const total = project.tasks.length;
        const done = project.tasks.filter(t => t.column === 'done').length;
        const urgent = project.tasks.filter(t => t.priority === 'urgent' && t.column !== 'done').length;
        const progress = Math.round((done / total) * 100);
        return { total, done, progress, urgent };
      }, [project]);

      const formatCurrency = (amt) => `${db.currencySymbol || '₹'}${Number(amt).toLocaleString()}`;

              </nav>

              {/* Right User Bar / Auth Trigger */}
              <div className="flex items-center gap-3">

                    <button onClick={() => setView('new-project')} className="px-3.5 py-1.5 rounded-full bg-aura-blue/20 hover:bg-aura-blue/30 border border-aura-blue/40 text-xs font-semibold text-aura-sky transition-all flex items-center gap-1.5">+ New Mission</button>
                    <div title={`Logged in as ${authUser.email}`} className="w-8 h-8 rounded-full bg-gradient-to-tr from-aura-coral to-aura-cyan flex items-center justify-center font-bold text-xs text-midnight shadow-glow-coral">
                      {db.user.avatar}
                    </div>
                    <button onClick={handleSignOut} className="text-xs text-slate-400 hover:text-white px-2 py-1">Sign Out</button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button onClick={() => { setAuthMode('signin'); setAuthModalOpen(true); }} className="px-4 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition-all">Sign In</button>

                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/[0.05] border border-white/15 backdrop-blur-xl text-xs font-semibold uppercase text-slate-300 mb-8 shadow-glass">
                  <span className="w-2 h-2 rounded-full bg-aura-cyan shadow-[0_0_8px_#06b6d4]"></span>
                  The Operating System for Teams on a Mission

                <div className="max-w-4xl mx-auto px-4">
                  <h1 className="font-display italic text-5xl sm:text-7xl lg:text-8xl text-white font-normal leading-[1.08] mb-6">
                    Great things don’t <br className="hidden sm:inline" />
                    <span className="font-sans not-italic font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400">happen alone.</span>

                  <p className="max-w-2xl mx-auto text-base sm:text-xl text-slate-300 font-light mb-10 leading-relaxed">

                  <div className="flex flex-col sm:flex-row items-center justify-center gap-5 mb-8">
                    <button onClick={() => setView('dashboard')} className="w-full sm:w-auto px-8 py-3.5 rounded-full font-semibold text-white bg-gradient-to-r from-aura-blue via-aura-cyan to-aura-coral shadow-glow-cyan hover:scale-[1.02] transition-all">Start a crew workspace ↗</button>
                    <button onClick={() => { setActiveProjectId('proj-atlas'); setView('project'); }} className="w-full sm:w-auto px-8 py-3.5 rounded-full font-medium text-slate-200 bg-white/[0.04] border border-white/15 backdrop-blur-xl hover:bg-white/[0.08] transition-all">Explore live demo</button>
                  </div>
                </div>

                {/* Floating Metric Badges */}
                <div className="w-full max-w-6xl mx-auto mt-12 grid grid-cols-2 md:grid-cols-4 gap-4 px-4 z-20">
                  <div className="p-4 rounded-3xl bg-surface-glass border border-white/10 backdrop-blur-2xl text-center shadow-glass">
                    <div className="text-2xl sm:text-3xl font-bold text-white font-display">100%</div>
                    <div className="text-xs text-slate-400 mt-1 uppercase">Decision Traceability</div>
                  </div>
                  <div className="p-4 rounded-3xl bg-surface-glass border border-white/10 backdrop-blur-2xl text-center shadow-glass">
                    <div className="text-2xl sm:text-3xl font-bold text-aura-sky font-display">₹ / $ / €</div>
                    <div className="text-xs text-slate-400 mt-1 uppercase">Multi-currency Ledger</div>
                  </div>
                  <div className="p-4 rounded-3xl bg-surface-glass border border-white/10 backdrop-blur-2xl text-center shadow-glass">
                    <div className="text-2xl sm:text-3xl font-bold text-aura-coral font-display">&lt; 3 Min</div>
                    <div className="text-xs text-slate-400 mt-1 uppercase">AI Sprint Breakdown</div>
                  </div>
                  <div className="p-4 rounded-3xl bg-surface-glass border border-white/10 backdrop-blur-2xl text-center shadow-glass">
                    <div className="text-2xl sm:text-3xl font-bold text-white font-display">1-Click</div>
                    <div className="text-xs text-slate-400 mt-1 uppercase">Handover Export</div>
                  </div>
                </div>
              </section>
            </main>
          )}

          {/* VIEW: MAIN DASHBOARD */}
          {view === 'dashboard' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-8 py-8 animate-fade-in">
              <div className="flex flex-col md:flex-row md:items-center justify-between pb-8 border-b border-white/10 gap-4">
                <div>
                  <h1 className="text-3xl sm:text-4xl font-bold text-white">Mission Command</h1>
                  <p className="text-sm text-slate-400 mt-1">Logged in as {db.user.name} ({authUser ? authUser.email : 'Guest Session'})</p>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={() => setIsAIModalOpen(true)} className="px-4 py-2.5 rounded-full bg-white/[0.04] border border-white/15 text-xs font-semibold text-aura-coral flex items-center gap-2">⚡ AI Breakdown</button>
                  <button onClick={() => setView('new-project')} className="px-5 py-2.5 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">+ Create Project</button>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                {db.projects.map(proj => (
                  <div key={proj.id} onClick={() => { setActiveProjectId(proj.id); setView('project'); }} className="p-6 rounded-3xl bg-surface-glass border border-white/10 hover:border-aura-cyan/50 backdrop-blur-2xl transition-all cursor-pointer shadow-glass">
                    <span className="text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-full bg-aura-blue/20 text-aura-sky font-semibold">{proj.category}</span>
                    <h3 className="text-xl font-bold text-white mt-2">{proj.name}</h3>
                    <p className="text-xs text-slate-300 mt-1">{proj.tagline}</p>
                    <div className="mt-6 flex justify-between text-xs font-mono text-slate-400">
                      <span>Target: {proj.targetDate}</span>
                      <span className="text-aura-cyan font-bold">{proj.tasks.length} tasks</span>
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* VIEW: CREATE PROJECT WIZARD */}
          {view === 'new-project' && (
            <main className="max-w-2xl mx-auto px-4 py-10 animate-fade-in">
              <h1 className="text-3xl font-bold text-white mb-6">New Mission Workspace</h1>
              <form onSubmit={async (e) => {
                e.preventDefault();
                const form = e.target;
                const newProj = {
                  id: `proj-${Date.now()}`,
                  name: form.projName.value,
                  tagline: form.projTagline.value,
                  category: form.projCategory.value,
                  status: 'Active',
                  startDate: new Date().toISOString().split('T')[0],
                  targetDate: form.projTargetDate.value,
                  totalBudget: Number(form.projBudget.value) || 100000,
                  progress: 0,
                  members: [{ id: 'm-1', name: db.user.name, role: 'Owner', title: 'Lead', avatar: db.user.avatar, email: db.user.email }],
                  tasks: [],
                  decisions: [],
                  expenses: [],
                  resources: [],
                  activity: []
                };

                updateDb({ ...db, projects: [newProj, ...db.projects] });
                setActiveProjectId(newProj.id);
                setView('project');

                if (supabase) {
                  await supabase.from('projects').insert([{
                    id: newProj.id,
                    name: newProj.name,
                    tagline: newProj.tagline,
                    category: newProj.category,
                    status: newProj.status,
                    start_date: newProj.startDate,
                    target_date: newProj.targetDate,
                    total_budget: newProj.totalBudget,
                    progress: newProj.progress
                  }]);
                }
                showToast(`Mission workspace initialized: ${newProj.name}`);
              }} className="space-y-4 p-8 rounded-3xl bg-surface-glass border border-white/10 shadow-glass">
                <div>
                  <label className="text-xs uppercase text-slate-400 block mb-1">Project Name</label>
                  <input name="projName" required defaultValue="Project Odyssey" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white outline-none focus:border-aura-cyan" />
                </div>
                <div>
                  <label className="text-xs uppercase text-slate-400 block mb-1">Tagline</label>
                  <input name="projTagline" required defaultValue="Decentralized squad execution." className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white outline-none focus:border-aura-cyan" />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs uppercase text-slate-400 block mb-1">Category</label>
                    <select name="projCategory" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white">
                      <option value="Startup Launch">Startup Launch</option>
                      <option value="Hackathon">Hackathon</option>
                      <option value="Event Planning">Event</option>
                      <option value="Content Production">Content</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs uppercase text-slate-400 block mb-1">Target Date</label>
                    <input type="date" name="projTargetDate" defaultValue="2026-12-31" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white" />
                  </div>
                </div>
                <div>
                  <label className="text-xs uppercase text-slate-400 block mb-1">Estimated Budget ({db.currency})</label>
                  <input type="number" name="projBudget" defaultValue="250000" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-white" />
                </div>
                <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-aura-blue to-aura-cyan font-bold text-white mt-4 shadow-glow-cyan">Launch Workspace ↗</button>
              </form>
            </main>
          )}

          {/* VIEW: PROJECT WORKSPACE */}
          {view === 'project' && project && (
            <main className="max-w-7xl mx-auto px-4 sm:px-8 py-6 animate-fade-in">
              <div className="p-6 rounded-[2.5rem] bg-surface-glass border border-white/15 backdrop-blur-2xl mb-6 shadow-glass">
                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-mono uppercase px-2.5 py-0.5 rounded-full bg-aura-blue/20 text-aura-sky font-semibold">{project.category}</span>
                    <h1 className="text-3xl font-bold text-white mt-2">{project.name}</h1>
                    <p className="text-xs text-slate-300 mt-1">{project.tagline}</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setInviteModalOpen(true)} className="px-4 py-2 rounded-full bg-white/10 text-xs font-semibold text-white">+ Invite Crew</button>
                    <button onClick={() => setIsAIModalOpen(true)} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-coral to-aura-sunset text-xs font-bold text-white shadow-glow-coral">⚡ AI Plan</button>
                  </div>
                </div>

                <div className="flex gap-2 mt-6 pt-4 border-t border-white/10 overflow-x-auto text-xs">
                  {['overview', 'tasks', 'decisions', 'budget', 'team'].map(tab => (
                    <button key={tab} onClick={() => setActiveProjectTab(tab)} className={`px-4 py-2 rounded-full capitalize font-semibold transition-all ${activeProjectTab === tab ? 'bg-white text-midnight' : 'text-slate-400 hover:text-white'}`}>
                      {tab}
                    </button>
                  ))}
                </div>
              </div>

              {/* OVERVIEW TAB */}
              {activeProjectTab === 'overview' && (
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  <div className="p-6 rounded-3xl bg-surface-glass border border-white/10">
                    <span className="text-xs font-mono text-slate-400 uppercase">Mission Velocity</span>
                    <div className="text-3xl font-bold text-white mt-2">{taskMetrics.progress}%</div>
                    <div className="w-full bg-white/10 h-2 rounded-full mt-3 overflow-hidden">
                      <div className="bg-aura-cyan h-full rounded-full" style={{ width: `${taskMetrics.progress}%` }}></div>
                    </div>
                  </div>
                  <div className="p-6 rounded-3xl bg-surface-glass border border-white/10">
                    <span className="text-xs font-mono text-slate-400 uppercase">Budget Expended</span>
                    <div className="text-3xl font-bold text-aura-sky mt-2">{formatCurrency(budgetMetrics.spent)}</div>
                    <div className="text-xs text-slate-400 mt-1">Remaining: {formatCurrency(budgetMetrics.remaining)}</div>
                  </div>
                  <div className="p-6 rounded-3xl bg-surface-glass border border-white/10">
                    <span className="text-xs font-mono text-slate-400 uppercase">Signed Decisions</span>
                    <div className="text-3xl font-bold text-aura-coral mt-2">{project.decisions.length} Locked</div>
                    <div className="text-xs text-emerald-400 mt-1">Consensus recorded</div>
                  </div>
                </div>
              )}

              {/* TASKS TAB (KANBAN) */}
              {activeProjectTab === 'tasks' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Tasks</h2>
                    <button onClick={async () => {
                      const title = prompt('Task title:');
                      if (!title) return;
                      const newTask = {
                        id: `t-${Date.now()}`,
                        title,
                        column: 'todo',
                        priority: 'high',
                        assignee: db.user.name,
                        dueDate: '2026-11-20',
                        checklist: []
                      };
                      const updatedProjects = db.projects.map(p => p.id === project.id ? { ...p, tasks: [newTask, ...p.tasks] } : p);
                      updateDb({ ...db, projects: updatedProjects });

                      if (supabase) {
                        await supabase.from('tasks').insert([{
                          id: newTask.id,
                          project_id: project.id,
                          title: newTask.title,
                          column_name: newTask.column,
                          priority: newTask.priority,
                          assignee: newTask.assignee,
                          due_date: newTask.dueDate
                        }]);
                      }
                      showToast(`Task created: ${title}`);
                    }} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">+ Add Task</button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    {['todo', 'in_progress', 'review', 'done'].map(col => {
                      const colTasks = project.tasks.filter(t => t.column === col);
                      return (
                        <div key={col} className="p-4 rounded-3xl bg-surface-glass border border-white/10">
                          <h4 className="text-xs font-bold uppercase text-slate-400 mb-3">{col.replace('_', ' ')} ({colTasks.length})</h4>
                          <div className="space-y-3">
                            {colTasks.map(t => (
                              <div key={t.id} className="p-3.5 rounded-2xl bg-surface-elevated border border-white/10 text-xs">
                                <div className="font-semibold text-white">{t.title}</div>
                                <div className="text-[10px] text-slate-400 mt-2 flex justify-between items-center">
                                  <span>{t.assignee}</span>
                                  <select value={t.column} onChange={async (e) => {
                                    const newCol = e.target.value;
                                    const updatedTasks = project.tasks.map(x => x.id === t.id ? { ...x, column: newCol } : x);
                                    updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, tasks: updatedTasks } : p) });
                                    if (supabase) await supabase.from('tasks').update({ column_name: newCol }).eq('id', t.id);
                                  }} className="bg-midnight text-aura-cyan rounded px-1 outline-none">
                                    <option value="todo">To Do</option>
                                    <option value="in_progress">In Progress</option>
                                    <option value="review">Review</option>
                                    <option value="done">Done</option>
                                  </select>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* DECISIONS TAB */}
              {activeProjectTab === 'decisions' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Signed Decisions</h2>
                    <button onClick={async () => {
                      const title = prompt('Decision Title:');
                      if (!title) return;
                      const chosen = prompt('Chosen resolution:') || '';
                      const rationale = prompt('Rationale:') || '';
                      const newDec = {
                        id: `dec-${Date.now()}`,
                        title,
                        context: 'Recorded via alignment meeting.',
                        chosen,
                        rationale,
                        status: 'Approved',
                        owner: db.user.name,
                        approvedBy: db.user.name,
                        date: new Date().toISOString().split('T')[0]
                      };
                      updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, decisions: [newDec, ...p.decisions] } : p) });
                      if (supabase) {
                        await supabase.from('decisions').insert([{
                          id: newDec.id,
                          project_id: project.id,
                          title: newDec.title,
                          context: newDec.context,
                          chosen: newDec.chosen,
                          rationale: newDec.rationale,
                          status: newDec.status,
                          owner: newDec.owner,
                          approved_by: newDec.approvedBy,
                          date: newDec.date
                        }]);
                      }
                      showToast('Decision recorded in Supabase!');
                    }} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-coral to-aura-sunset text-xs font-bold text-white shadow-glow-coral">+ Record Decision</button>
                  </div>

                  <div className="space-y-3">
                    {project.decisions.map(d => (
                      <div key={d.id} className="p-5 rounded-3xl bg-surface-glass border border-white/10 text-xs">
                        <div className="flex justify-between font-bold text-white text-sm mb-2">
                          <span>{d.title}</span>
                          <span className="text-emerald-400 font-mono text-xs">{d.status}</span>
                        </div>
                        <p className="text-slate-300"><strong>Chosen:</strong> {d.chosen}</p>
                        <p className="text-slate-400 mt-1"><strong>Reason:</strong> {d.rationale}</p>
                        <div className="mt-3 text-[10px] font-mono text-slate-500">Signed by {d.approvedBy} on {d.date}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* BUDGET TAB */}
              {activeProjectTab === 'budget' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-white">Budget Ledger</h2>
                      <p className="text-xs text-slate-400">Total: {formatCurrency(project.totalBudget)} | Spent: {formatCurrency(budgetMetrics.spent)}</p>
                    </div>
                    <button onClick={async () => {
                      const title = prompt('Expense description:');
                      if (!title) return;
                      const amount = Number(prompt('Amount:')) || 0;
                      const newExp = {
                        id: `exp-${Date.now()}`,
                        title,
                        category: 'Operations',
                        amount,
                        date: new Date().toISOString().split('T')[0],
                        payer: db.user.name,
                        status: 'Paid'
                      };
                      updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, expenses: [newExp, ...p.expenses] } : p) });
                      if (supabase) {
                        await supabase.from('expenses').insert([{
                          id: newExp.id,
                          project_id: project.id,
                          title: newExp.title,
                          category: newExp.category,
                          amount: newExp.amount,
                          payer: newExp.payer,
                          date: newExp.date,
                          status: newExp.status
                        }]);
                      }
                      showToast('Expense recorded!');
                    }} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">+ Add Expense</button>
                  </div>

                  <div className="p-4 rounded-3xl bg-surface-glass border border-white/10 overflow-x-auto text-xs">
                    <table className="w-full text-left">
                      <thead>
                        <tr className="border-b border-white/10 text-slate-400 font-mono">
                          <th className="pb-2">Description</th>
                          <th className="pb-2">Payer</th>
                          <th className="pb-2 text-right">Amount</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {project.expenses.map(e => (
                          <tr key={e.id}>
                            <td className="py-2.5 font-semibold text-white">{e.title}</td>
                            <td className="py-2.5 text-slate-400">{e.payer}</td>
                            <td className="py-2.5 text-right font-mono text-aura-cyan font-bold">{formatCurrency(e.amount)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TEAM TAB */}
              {activeProjectTab === 'team' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Team Roster</h2>
                    <button onClick={() => setInviteModalOpen(true)} className="px-4 py-2 rounded-full bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan">+ Invite Member</button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {project.members.map(m => (
                      <div key={m.id} className="p-4 rounded-2xl bg-surface-glass border border-white/10 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-surface-elevated border border-white/20 flex items-center justify-center font-bold text-white text-xs">{m.avatar}</div>
                          <div>
                            <div className="font-bold text-white text-sm">{m.name}</div>
                            <div className="text-xs text-slate-400">{m.title} • {m.role}</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          )}

          {/* AUTH MODAL (SIGN IN / SIGN UP) */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-2xl animate-fade-in">
              <div className="w-full max-w-sm p-6 sm:p-8 rounded-[2rem] bg-surface-elevated border border-white/20 shadow-glow-cyan">
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h3 className="text-xl font-bold text-white">{authMode === 'signin' ? 'Sign In' : 'Create Account'}</h3>
                    <p className="text-xs text-slate-400 mt-1">{authMode === 'signin' ? 'Sign in to access your missions' : 'Join CrewOS to launch your squad'}</p>
                  </div>
                  <button onClick={() => setAuthModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Email</label>
                    <input type="email" required value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="you@example.com" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-xs text-white placeholder-slate-500 outline-none focus:border-aura-cyan" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Password</label>
                    <input type="password" required minLength="6" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-2.5 rounded-xl bg-midnight border border-white/15 text-xs text-white placeholder-slate-500 outline-none focus:border-aura-cyan" />
                  </div>

                  <button type="submit" disabled={authLoading} className="w-full py-3 rounded-xl bg-gradient-to-r from-aura-blue to-aura-cyan text-xs font-bold text-white shadow-glow-cyan hover:scale-[1.02] transition-all disabled:opacity-50">
                    {authLoading ? 'Verifying...' : (authMode === 'signin' ? 'Sign In ↗' : 'Create Free Account ↗')}
                  </button>
                </form>

                <div className="mt-6 pt-4 border-t border-white/10 text-center text-xs text-slate-400">
                  {authMode === 'signin' ? (
                    <span>Don't have an account? <button onClick={() => setAuthMode('signup')} className="text-aura-cyan font-semibold hover:underline">Sign up</button></span>
                  ) : (
                    <span>Already have an account? <button onClick={() => setAuthMode('signin')} className="text-aura-cyan font-semibold hover:underline">Sign in</button></span>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* AI MODAL */}
          {isAIModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-2xl">
              <div className="w-full max-w-lg p-6 rounded-[2rem] bg-surface-elevated border border-white/20">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">AI Sprint Planning</h3>
                  <button onClick={() => setIsAIModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <textarea rows="3" defaultValue="Deploy beta client onboarding portal and safety compliance checks in 3 weeks." className="w-full p-3 rounded-xl bg-midnight border border-white/15 text-xs text-white mb-4 outline-none focus:border-aura-cyan"></textarea>
                <button onClick={async () => {
                  const aiTask = {
                    id: `t-ai-${Date.now()}`,
                    title: 'Conduct automated safety compliance check audit',
                    column: 'todo',
                    priority: 'urgent',
                    assignee: db.user.name,
                    dueDate: '2026-11-25',
                    checklist: []
                  };
                  updateDb({ ...db, projects: db.projects.map(p => p.id === project.id ? { ...p, tasks: [aiTask, ...p.tasks] } : p) });
                  if (supabase) {
                    await supabase.from('tasks').insert([{
                      id: aiTask.id,
                      project_id: project.id,
                      title: aiTask.title,
                      column_name: aiTask.column,
                      priority: aiTask.priority,
                      assignee: aiTask.assignee,
                      due_date: aiTask.dueDate
                    }]);
                  }
                  setIsAIModalOpen(false);
                  showToast('AI synthesized sprint task scheduled!');
                }} className="w-full py-2.5 rounded-xl bg-gradient-to-r from-aura-coral to-aura-sunset font-bold text-xs text-white">
                  Synthesize Sprint Tasks ↗
                </button>
              </div>
            </div>
          )}

          {/* INVITE MODAL */}
          {inviteModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-xl">
              <div className="w-full max-w-md p-6 rounded-3xl bg-surface-elevated border border-white/20 shadow-glass">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">Invite Crew Members</h3>
                  <button onClick={() => setInviteModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <div className="p-3 rounded-2xl bg-midnight border border-white/15 flex items-center justify-between mb-4">
                  <span className="text-xs font-mono text-aura-cyan truncate">https://crewos-blush.vercel.app/join/{project.id}</span>
                  <button onClick={() => {
                    navigator.clipboard.writeText(`https://crewos-blush.vercel.app/join/${project.id}`);
                    setInviteCopied(true);
                    setTimeout(() => setInviteCopied(false), 2000);
                    showToast('Invite link copied!');
                  }} className="ml-2 px-3 py-1 rounded-xl bg-white/10 text-xs font-semibold text-white">
                    {inviteCopied ? 'Copied ✓' : 'Copy'}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CrewOSApp />);
  </script>
</body>
</html>
